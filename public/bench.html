<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bench · Production Planner</title>
  <!-- iPad / phone home-screen app: opens full screen with this bench's name and icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bench" />
  <meta name="theme-color" content="#173f6e" />
  <link rel="apple-touch-icon" href="icons/bench.png" />
  <link rel="icon" type="image/png" href="icons/bench.png" />
  <link rel="stylesheet" href="css/blueprint.css" />
  <link rel="stylesheet" href="css/floor.css" />
  <style>

    main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
    }

    .card h2 { margin: 0 0 12px; font-size: 20px; }
    .hidden { display: none !important; }


    .stat {
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .stat .label { color: var(--muted); font-weight: 600; font-size: 14px; }
    .stat .value { font-size: 40px; font-weight: 700; margin-top: 4px; line-height: 1; }
    .stat .value.small-value { font-size: 22px; line-height: 1.3; }
    .stat .value.down { color: var(--warn); }
    .stat .note { color: var(--ink-2); font-size: 13px; margin-top: 6px; font-weight: 600; }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .setup {
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--inset);
      padding: 14px;
    }

    .setup.verizon { border-color: var(--verizon); }
    .setup.global { border-color: var(--global); }
    .setup h3 { margin: 0 0 4px; font-size: 21px; }
    .setup .setup-sub { color: var(--ink-2); font-weight: 600; margin-bottom: 10px; }
    .setup table { width: 100%; border-collapse: collapse; }
    .setup th, .setup td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 15px; }
    .setup th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .setup .phases { margin-top: 10px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }

    .phase-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .phase-tabs button { background: var(--btn); color: var(--text); }
    .phase-tabs button.active { background: var(--accent); color: var(--on-accent); }

    .hint { color: var(--muted); margin: -4px 0 14px; line-height: 1.45; }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .zone {
      min-height: 160px;
      border-radius: var(--radius);
      border: 2px dashed var(--rule-strong);
      background: var(--inset);
      padding: 12px;
      transition: border-color 0.12s, background 0.12s;
    }

    .zone.job { border-style: solid; }
    .zone.job.verizon { border-color: var(--verizon); }
    .zone.job.global { border-color: var(--global); }
    .zone h3 { margin: 0 0 4px; font-size: 18px; }
    .zone .zone-detail { color: var(--ink-2); font-size: 13px; font-weight: 600; margin-bottom: 10px; min-height: 18px; }
    .zone.drop-target { background: var(--accent-soft); border-color: var(--accent); }
    .zone.tap-ready { cursor: pointer; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--sheet);
      border: 1px solid var(--rule-strong);
      color: var(--text);
      font-weight: 600;
      font-size: 16px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .chip.selected { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .chip.ghost { position: fixed; pointer-events: none; z-index: 1000; opacity: 0.92; box-shadow: 0 8px 24px rgba(15, 39, 71, 0.23); }
    .empty { color: var(--muted); font-size: 14px; }

    .events { list-style: none; margin: 0; padding: 0; }
    .events li { padding: 10px 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
    .events .time { color: var(--muted); font-weight: 600; margin-right: 8px; }
    .events .who { color: var(--muted); font-size: 13px; margin-left: 6px; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--inset);
    }

    .dialog {
      width: min(460px, 100%);
      background: var(--sheet);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .dialog h3 { margin: 0 0 6px; font-size: 20px; }
    .dialog p { margin: 0 0 14px; color: var(--muted); }
    .dialog .choices { display: grid; gap: 10px; }

    .dialog input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--inset);
      color: var(--text);
      font-size: 16px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1600;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: var(--radius);
      background: var(--sheet);
      border: 1px solid var(--good);
      font-weight: 600;
    }

    .toast.error { border-color: var(--bad); color: var(--red); }

    /* Crew-style job board ------------------------------------------- */
    .crew-layout { display: grid; grid-template-columns: minmax(260px, 0.9fr) minmax(0, 1.6fr); gap: 0; align-items: stretch; border-top: 1px solid var(--rule); }
    .crew-panel { background: none; border: 0; border-radius: 0; padding: 12px 16px 4px 0; }
    .crew-panel + .crew-panel { border-left: 1px solid var(--rule); padding: 12px 0 4px 16px; }
    .crew-panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .crew-panel-head h3 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
    .crew-panel-head span { color: var(--muted); font-size: 13px; font-weight: 600; }
    .zone.crew-roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; min-height: 110px; padding: 4px; border: 2px dashed transparent; background: transparent; }
    .chip.crew-card {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 4px 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--sheet);
      border: 1px solid var(--rule);
      font-size: 14px;
      font-weight: 400;
    }
    .chip.crew-card.selected { background: var(--sheet); color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
    .chip.crew-card.ghost { width: 240px; }
    .crew-avatar { grid-row: span 2; width: 46px; height: 46px; border-radius: var(--radius); display: grid; place-items: center; font-weight: 700; font-size: 16px; --k: var(--k-cage); color: var(--k); background: color-mix(in srgb, var(--k) 9%, var(--raised)); border: 1px solid var(--k); font-family: var(--font-label); letter-spacing: 0.04em; }
    .crew-who { min-width: 0; }
    .crew-who b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crew-who span { font-size: 13px; color: var(--muted); font-weight: 600; }
    .crew-skills { grid-column: 2; display: flex; gap: 4px; flex-wrap: wrap; }
    .crew-skill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: var(--radius); font-size: 11px; font-weight: 700; background: var(--inset); border: 1px solid var(--rule); }
    .crew-skill i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule-strong); }
    .crew-skill i.on { background: currentColor; box-shadow: none; }
    .crew-skill.none { opacity: 0.35; }
    .crew-skill.k-assembly { color: var(--amber); } .crew-skill.k-testing { color: var(--accent); }
    .crew-skill.k-hardware { color: var(--violet); } .crew-skill.k-packing { color: var(--ok); }
    .crew-pips { grid-column: 2; display: flex; gap: 3px; }
    .crew-pips i { width: 24px; height: 6px; border-radius: 2px; background: var(--btn); }
    .crew-stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1px; padding: 1px 0; background: var(--sheet); }
    .crew-stations > * { box-shadow: 0 0 0 1px var(--rule); }
    .zone.crew-station { min-height: 150px; border: 0; border-radius: 0; background: var(--sheet); padding: 12px; transition: box-shadow 0.12s, background 0.12s, opacity 0.12s; }
    .crew-station-head { display: flex; align-items: center; gap: 8px; }
    .crew-station-head b { font-size: 17px; }
    .crew-icon { width: 32px; height: 32px; border-radius: var(--radius); display: grid; place-items: center; font-size: 12px; font-weight: 700; --k: var(--k-cage); color: var(--k); background: color-mix(in srgb, var(--k) 9%, var(--raised)); border: 1px solid var(--k); font-family: var(--font-label); letter-spacing: 0.04em; flex: none; }
    .crew-state { font-size: 13px; font-weight: 600; margin: 6px 0 10px; color: var(--muted); }
    .crew-state.ok { color: var(--accent); }
    .crew-state.short { color: var(--warn); }
    .crew-detail-line { font-size: 12px; color: var(--ink-2); font-weight: 600; margin: -4px 0 8px; }
    .crew-slots { display: flex; flex-direction: column; gap: 8px; }
    .crew-slots .chip.crew-card { grid-template-columns: 38px 1fr; padding: 8px 10px; }
    .crew-slots .crew-avatar { width: 38px; height: 38px; font-size: 13px; }
    .crew-slots .crew-skills, .crew-slots .crew-pips { display: none; }
    .crew-drop { min-height: 40px; border: 1px dashed var(--rule-strong); border-radius: var(--radius); padding: 10px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
    .crew-station .cant { display: none; margin-left: auto; font-size: 12px; font-weight: 700; color: var(--bad); }
    .zone.crew-station.fit-3 { box-shadow: 0 0 0 1px var(--rule), inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
    .zone.crew-station.fit-2 { box-shadow: 0 0 0 1px var(--rule), inset 0 0 0 1px var(--accent); }
    .zone.crew-station.fit-0 { opacity: 0.35; }
    .zone.crew-station.fit-0 .cant { display: inline; }
    .zone.crew-station.drop-target { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--rule), inset 0 0 0 2px var(--accent); }
    .zone.crew-roster.drop-target { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
    .crew-detail { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
    .crew-detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .crew-detail-head b { font-size: 17px; }
    .crew-detail-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
    .crew-detail-skills div { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: var(--radius); background: var(--inset); border: 1px solid var(--rule); font-size: 13px; font-weight: 600; }
    .crew-dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule-strong); margin-left: 3px; }
    .crew-dots i.on { background: var(--accent); box-shadow: none; }
    .crew-today { margin-top: 8px; font-size: 14px; color: var(--accent); line-height: 1.6; }
    @media (max-width: 900px) { .crew-layout { grid-template-columns: 1fr; } .crew-panel + .crew-panel { border-left: 0; border-top: 1px solid var(--rule); padding-left: 0; } }

    /* Request buttons ------------------------------------------------- */
    .action-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .action {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 72px; padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--rule-strong);
      background: var(--raised); color: var(--ink);
      font-family: var(--font-label); font-size: 22px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .action:hover { background: var(--inset); }
    .action:active { background: var(--btn); }
    .action svg { width: 30px; height: 30px; flex: none; }
    .action.help svg { color: var(--amber); } .action.stock svg { color: var(--accent); } .action.faulty svg { color: var(--red); }
    .action-count { min-width: 28px; padding: 2px 8px; border-radius: var(--radius); background: var(--ink); color: var(--raised); font-size: 17px; letter-spacing: 0; }

    @media (max-width: 700px) {
      .top { padding: 12px 16px; }
      main { padding: 14px 16px 32px; }
      h1 { font-size: 22px; }
      .stat .value { font-size: 32px; }
    }

    /* Every bench ---------------------------------------------------- */
    .zone.job.bench-assembly { border-color: var(--amber); }
    .zone.job.bench-hardware { border-color: var(--violet); }
    .zone.job.bench-packing { border-color: var(--ok); }

    .batch-table { width: 100%; border-collapse: collapse; }
    .batch-table th, .batch-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 16px; vertical-align: top; }
    .batch-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .batch-table td.units { font-size: 22px; font-weight: 700; white-space: nowrap; }
    .batch-table td.units small { font-size: 13px; color: var(--muted); font-weight: 600; }
    .batch-table .setup-text { white-space: pre-line; color: var(--ink); }
    .table-scroll { overflow-x: auto; }
    .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--rule-strong); }

    .notes-card { border-color: var(--warn); }
    .notes-text { white-space: pre-line; font-size: 17px; line-height: 1.5; }

    .batch-status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .batch-status { display: flex; flex-direction: column; gap: 10px; }
    .batch-status .sticky { font-size: 16px; padding: 14px 16px; }
    .batch-status .sticky b { font-size: 18px; }
    .batch-status .sticky-status { font-size: 20px; }
    .batch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .batch-actions button { flex: 1 1 auto; padding: 14px 12px; font-size: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card-head h2 { margin: 0; }
    .waiting-here { grid-column: 1 / -1; margin: 10px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
    .pinned-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

    .next-plan { margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .chooser-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 6px 0 14px; }
    .chooser-grid a {
      display: block;
      padding: 18px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--inset);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 20px;
    }
    .chooser-grid a span { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }

    /* One-screen bench (sideways iPad) ---------------------------------- */
    main { padding-top: 12px; }
    .bench-top { display: flex; align-items: stretch; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .block-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .block-tabs button { margin: 0; display: grid; gap: 1px; padding: 6px 14px; background: var(--raised); color: var(--ink-2); border: 1px solid var(--rule-strong); text-align: left; }
    .block-tabs button b { font-family: var(--font-label); font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
    .block-tabs button span { font-size: 13px; font-weight: 600; color: var(--muted); }
    .block-tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .block-tabs button.active span { color: var(--on-accent); opacity: 0.85; }
    .block-tabs button.now::after { content: "Now"; justify-self: start; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .bench-top .action-bar { flex: 1; margin: 0; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .bench-top .action { min-height: 52px; padding: 8px 12px; font-size: 17px; gap: 8px; }
    .bench-top .action svg { width: 22px; height: 22px; }
    .bench-main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
    .bench-main.no-team { grid-template-columns: 1fr; }
    .bench-left { display: grid; gap: 12px; }
    .bench-card { background: var(--raised); border: 1px solid var(--rule-strong); border-radius: var(--radius-lg); padding: 14px 16px; }
    .bench-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .bench-card-head h2 { margin: 0; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .bench-card-head button { margin: 0; padding: 6px 12px; }
    .job-line { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--rule); }
    .job-line:first-of-type { border-top: 0; padding-top: 0; }
    .job-station { font-family: var(--font-label); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .job-request { font-size: 44px; font-weight: 700; line-height: 1.08; color: var(--ink); }
    .job-request-label { font-weight: 500; color: var(--ink-2); }
    .job-each { font-size: 24px; font-weight: 700; color: var(--accent); }
    .job-what { font-size: 17px; font-weight: 600; color: var(--ink-2); }
    .job-then { font-size: 16px; font-weight: 600; color: var(--ink-2); }
    .job-now { font-size: 15px; font-weight: 700; color: var(--warn); }
    .job-orders { display: grid; gap: 2px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 16px; font-weight: 600; color: var(--ink-2); }
    .job-orders b { color: var(--ink); }
    .job-status { display: grid; gap: 8px; margin-top: 10px; }
    .job-status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .job-status-row .job-status-text { flex: 1 1 180px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
    .job-status-row button { margin: 0; padding: 12px 16px; font-size: 16px; }
    .bench-notes .msg-list { max-height: 230px; overflow-y: auto; }
    .bench-requests .req-list { max-height: 200px; overflow-y: auto; }
    .team-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .team-group h3 { margin: 0 0 8px; font-size: 16px; }
    .team-list { display: grid; gap: 6px; }
    .team-person { display: flex; align-items: center; gap: 10px; margin: 0; padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--sheet); font-size: 17px; font-weight: 600; color: var(--ink); cursor: pointer; }
    .team-person input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent); }
    .team-person small { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
    .team-person.off { background: var(--inset); color: var(--muted); }
    .team-empty { font-size: 14px; color: var(--muted); }
    .bench-right { display: grid; gap: 12px; align-content: start; }
    .guide-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .guide-card { display: grid; gap: 6px; margin: 0; padding: 6px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--sheet); color: var(--ink); text-align: left; cursor: zoom-in; }
    .guide-card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--inset); }
    .guide-card span { font-size: 14px; font-weight: 600; line-height: 1.25; }
    .guide-view { position: fixed; inset: 0; z-index: 1700; display: grid; place-items: center; padding: 16px; background: rgba(15, 39, 71, 0.82); cursor: zoom-out; }
    .guide-view img { max-width: 100%; max-height: calc(100vh - 32px); border-radius: var(--radius); background: #ffffff; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
    .more-sheet { position: fixed; inset: 0; z-index: 1200; overflow-y: auto; background: var(--page); padding: 16px 20px 40px; }
    .more-sheet .more-head { display: flex; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto 14px; }
    .more-sheet .more-head h2 { margin: 0; }
    .more-sheet > section, .more-sheet > .card { max-width: 1400px; margin-left: auto; margin-right: auto; }
    @media (max-width: 860px) { .bench-main { grid-template-columns: 1fr; } }

    /* Each bench has its colour (as on the plan picture), so screens tell
       apart at a glance. Jobs on a bench wear their own job's colour. */
    body { --bench: #8a96a6; }
    body[data-bench="subassembly"] { --bench: #7a5bb5; }
    body[data-bench="assembly"] { --bench: #c2453b; }
    body[data-bench="testing"] { --bench: #3f7fbf; }
    body[data-bench="hardware"] { --bench: #3f8f4e; }
    body[data-bench="buildup"] { --bench: #c75b74; }
    body[data-bench="packing"] { --bench: #d39d12; }
    #benchTitle { display: inline-block; padding: 6px 16px; border-radius: var(--radius); background: var(--bench); color: #ffffff; font-size: 28px; font-weight: 700; }
    .block-tabs button.active { background: var(--bench); border-color: var(--bench); color: #ffffff; }
    .block-tabs button.active span { color: #ffffff; }
    .bench-card-head h2 { font-size: 17px; font-weight: 700; color: var(--ink); }
    .team-group h3 { display: inline-block; margin: 0 0 10px; padding: 5px 12px; border-radius: 999px; background: var(--job, var(--bench)); color: #ffffff; font-family: var(--font-label); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

    /* Assembly: the request in big type, specs underneath. */
    .job-headline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; }
    .job-big { font-size: 54px; font-weight: 800; line-height: 1.05; color: var(--ink); }
    .job-each-inline { font-size: 30px; font-weight: 700; color: var(--bench); }
    .job-specs { margin-top: 2px; font-size: 22px; font-weight: 600; color: var(--ink-2); }
    .job-line.simple { padding: 10px 0; }
    .job-line.simple + .job-line.simple { border-top: 1px solid var(--rule); }
    .job-status-row .job-status-text:empty { display: none; }
  </style>
</head>
<body>

    <div>
      <h1 id="benchTitle">Bench</h1>
    </div>
    <div class="tb-cell"><span class="tb-label">Date</span><span class="tb-value" id="dateLabel">Loading…</span></div>
    <div class="tb-cell hidden"><span class="tb-label">Target</span><span class="tb-value" id="tbTarget">–</span></div>
    <div class="tb-cell"><span class="tb-label">Connection</span><span id="liveBadge" class="live">Live</span></div>
    <div class="top-actions" id="topActions">
      <button type="button" class="secondary" id="prevDay" aria-label="Previous day"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <input type="date" id="dateInput" aria-label="Plan date" />
      <button type="button" class="secondary" id="nextDay" aria-label="Next day"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button type="button" class="secondary" id="todayButton">Today</button>
      <button type="button" class="secondary" id="moreButton">More</button>

  </header>

  <main>
    <section id="chooser" class="card hidden">

    </section>

    <section id="emptyState" class="card hidden">

      <p class="hint" id="emptyMessage">Not released yet.</p>
      <div class="next-plan hidden" id="nextPlan"></div>
    </section>

    <div id="planArea" class="hidden">
      <div class="bench-top">
        <div class="block-tabs" id="blockTabs" role="tablist" aria-label="Block"></div>
        <section class="action-bar" id="actionBar" aria-label="Requests"></section>
      </div>
      <div class="bench-main" id="benchMain">
        <div class="bench-left">
          <section class="bench-card" id="jobCard"></section>
          <section class="bench-card bench-requests hidden" id="requestsCard">

      <section class="card" id="batchesCard">

      </section>

      <section class="card" id="pinnedCard">
        <div class="card-head">

          <button type="button" class="secondary" id="pinNoteButton">+ Pin a note</button>

        <div class="pinned-row" id="pinnedNotes"></div>

      </section>

      <section class="card" id="boardCard">

      <section class="card">

      </div>

  </main>

  <script src="js/drag-board.js"></script>
  <script src="js/skills.js"></script>
  <script type="module">
    import {
      collection, doc, getDoc, getDocs, onSnapshot, setDoc, deleteDoc, updateDoc, addDoc,
      serverTimestamp, query, orderBy, limit, where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db, ensureAccess, lockScreen, friendlyError } from "./js/session.js";
    import {
      floorBatches, onRoute, batchTitle, progressOf, expectedUnits, statusText, statusNoteHtml, pinnedNoteHtml,
      watchFloor, setBatchStatus, askUnitsDone, askNote, addNote, editNote, removeNote, showPhoto,
      JOB_STAGES, waitingJobsAt, waitingJobHtml
    } from "./js/floor.js";
    import { REQUEST_KINDS, requestTitle, watchRequests, makeRequest, moveRequest, requestCardHtml, askHelp, askStock, askFaulty } from "./js/requests.js";
    import {
      watchLists, unitLabel, simLabel, labelOf, unitKeyOf, commsKeyOf, usesComms,
      testingPerDay, testingInBlock, assemblyRate, hardwareRate, packagingBuildRate,
      subAssemblyRate, testingRate, packingRate, currentBlock, blockClockLabel, hardwareChecks
    } from "./js/lists.js";
    import { watchMessages, addMessage, markMessageSeen, messageHtml, askMessage } from "./js/messages.js";

    // Jobs on the bench screens. Who can do each one comes from their
    // skill dots in Worker Admin (js/skills.js).
    const STATIONS = {
      subAssembly:    { label: "Sub Assembly" },
      assembly:       { label: "Assembly" },
      assemblyGen4:   { label: "Gen4 Assembly" },
      assemblyTap:    { label: "Tap Assembly" },
      testing:        { label: "Testing" },
      testingVerizon: { label: "Verizon Testing", network: "verizon" },
      testingGlobal:  { label: "Global Testing", network: "global" },
      hardware:       { label: "Hardware Check" },
      packing:        { label: "Packaging build-up" },
      finalPackaging: { label: "Packing" }
    };

    // A unit's own stations ("assembly:solar", "testing:solar") belong to
    // the bench of their first part.
    const baseOf = station => String(station || "").split(":")[0];
    const productOf = station => (String(station || "").includes(":") ? String(station).split(":").slice(1).join(":") : null);

    function stationInfo(station) {
      if (station === "subAssembly" && state.plan?.subAssemblyPacks) return { label: "Sub Assembly & Packaging build-up" };
      if (STATIONS[station]) return STATIONS[station];
      const product = productOf(station);
      if (product && baseOf(station) === "assembly") return { label: `${labelOf("units", product)} Assembly` };
      if (product && baseOf(station) === "testing") return { label: `${labelOf("units", product)} Testing` };
      return null;
    }

    const onList = (list, station) => list.includes(station) || (Boolean(productOf(station)) && list.includes(baseOf(station)));

    // Each bench screen: its jobs, and which batch details it shows.
    const BENCHES = {
      subassembly: {
        label: "Sub Assembly",
        blurb: "Tomorrow's parts, then Packaging build-up",
        stations: ["subAssembly"],
        columns: ["customer", "unit", "connector", "config", "setup", "units"],
        verb: "Make"
      },
      assembly: {
        label: "Assembly",
        blurb: "Assembly",
        stations: ["assembly", "assemblyGen4", "assemblyTap"],
        columns: ["customer", "unit", "connector", "config", "setup", "units"],
        verb: "Build"
      },
      testing: {
        label: "Testing",
        blurb: "Verizon and Global testing",
        stations: ["testing", "testingVerizon", "testingGlobal"],
        columns: null,   // network setup cards instead of a table
        verb: "Test"
      },
      hardware: {
        label: "Hardware Check",
        blurb: "Hardware check",
        stations: ["hardware"],
        columns: ["customer", "unit", "network", "config", "units"],
        verb: "Check"
      },
      buildup: {
        label: "Packaging build-up",
        blurb: "Boxes for packing",
        stations: ["packing"],
        columns: ["customer", "unit", "connector", "config", "units"],
        verb: "Build up"
      },
      packing: {
        label: "Packing",
        blurb: "Packing",
        stations: ["finalPackaging"],
        columns: ["customer", "unit", "connector", "config", "setup", "units"],
        verb: "Pack"
      },
      cage: {
        label: "Production Cage",
        blurb: "Parts to release for today's builds",
        stations: [],
        columns: ["customer", "unit", "network", "connector", "config", "setup", "units"]
      }
    };

    const requestedBench = new URLSearchParams(window.location.search).get("bench");
    const benchKey = Object.prototype.hasOwnProperty.call(BENCHES, requestedBench) ? requestedBench : null;
    const bench = benchKey ? BENCHES[benchKey] : null;
    const hasBoard = Boolean(bench && bench.stations.length);
    const ACTOR = bench ? `${bench.label} bench` : "Bench";

    const PHASES = [["start", "1st block"], ["second", "2nd block"], ["finish", "3rd block"]];
    const PHASE_KEYS = PHASES.map(([key]) => key);
    const phaseLabel = key => (PHASES.find(([value]) => value === key) || [key, key])[1];

    const NETWORKS = {
      verizon: { label: "Verizon", station: "testingVerizon", cls: "verizon" },
      global: { label: "Global", station: "testingGlobal", cls: "global" }
    };
    const SICK_REASON = "Sick / gone home";

    const $ = id => document.getElementById(id);
    const cellDate = value => { const [y, m, d] = String(value).split("-").map(Number); return new Intl.DateTimeFormat("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(new Date(y, m - 1, d, 12)).replace(/,/g, ""); };

    const state = {
      date: "",
      plan: null,
      reachable: true,    // false when the database couldn't be reached
      assignments: [],
      events: [],
      roster: null,
      staff: new Map(),
      presets: {},
      phase: "start",
      busy: false,
      live: true,
      nextPlan: null,     // { from, date } once the next released plan has been looked up
      role: null,         // "bench" or "management"
      progress: new Map(),
      notes: [],
      requests: [],
      requestsLoaded: false,
      messages: [],       // notes between this bench and management
      messagesLoaded: false,
      guides: [],         // guide pictures for this bench (Lists → Guides)
      followClock: true,  // show the block that's on now (until another is picked)
      waitingJobs: []     // live job cards waiting at this bench, any day
    };

    let stops = [];
    let detailStops = [];
    let retryTimer = null;
    let board = null;          // shared drag-and-drop (js/drag-board.js)
    let renderPending = false;

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function toInputDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function fromInputDate(value) {
      const [y, m, d] = String(value).split("-").map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12);
    }

    function longDate(value) {
      return new Intl.DateTimeFormat("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
        .format(fromInputDate(value));
    }

    function staffName(key) {
      const person = state.staff.get(key);
      return person?.firstName || person?.name || key;
    }

    function networkOf(batch) {
      return batch?.commsType === "verizon" ? "verizon" : "global";
    }

    function activeBatches(plan = state.plan) {
      return (plan?.batches || [])
        .map((batch, index) => ({ ...batch, index }))
        .filter(batch => Number(batch.quantity) > 0);
    }

    function plannedUnits(batch, plan = state.plan) {
      const target = (plan?.snapshot?.batchTargets || []).find(item => item.index === batch.index);
      return target ? Number(target.planned) || 0 : Number(batch.quantity) || 0;
    }

    function isBenchStation(station) {
      return Boolean(bench) && onList(bench.stations, station);
    }

    // 0 dots = can't do it. Not in production = can't do anything.
    function canDo(person, station) {
      return Boolean(stationInfo(station)) && window.PlannerSkills.levelFor(person, station) > 0;
    }

    // Best rating this person has for any job on this bench.
    function benchLevel(person) {
      return Math.max(0, ...benchJobs().map(job => window.PlannerSkills.levelFor(person, job.station)));
    }

    // The jobs this bench can move people between.
    function benchJobs() {
      if (!hasBoard || !state.plan) return [];
      const batches = activeBatches();
      const mixed = state.plan.workMode === "mixed";
      let stations;

      if (state.plan.productsDay && (benchKey === "testing" || benchKey === "assembly")) {
        // Any mix of units: each unit its own Assembly; network units test
        // on their network's station, standalone units on their own.
        const units = [...new Set(batches.map(unitKeyOf))];
        stations = benchKey === "assembly"
          ? units.map(unit => `assembly:${unit}`)
          : [
              ...["verizon", "global"].filter(network => batches.some(batch => usesComms(batch) && networkOf(batch) === network)).map(network => NETWORKS[network].station),
              ...[...new Set(batches.filter(batch => !usesComms(batch)).map(unitKeyOf))].map(unit => `testing:${unit}`)
            ];
      } else if (benchKey === "testing") {
        stations = mixed
          ? ["verizon", "global"].filter(network => batches.some(batch => networkOf(batch) === network)).map(network => NETWORKS[network].station)
          : ["testing"];
      } else if (benchKey === "assembly") {
        stations = [];
        if (mixed) {
          if (batches.some(batch => batch.unitType !== "tap")) stations.push("assemblyGen4");
          if (batches.some(batch => batch.unitType === "tap")) stations.push("assemblyTap");
        } else {
          stations.push("assembly");
        }
      } else {
        stations = [...bench.stations];
      }

      // Keep any job someone is already on, so nobody disappears.
      state.assignments.forEach(item => {
        if (isBenchStation(item.station) && !stations.includes(item.station)) stations.push(item.station);
      });

      const singleNetwork = networkOf(batches[0] || { commsType: "verizon" });
      return stations.map(station => ({
        station,
        label: stationInfo(station)?.label || station,
        network: stationInfo(station)?.network || (benchKey === "testing" && !productOf(station) ? singleNetwork : null)
      }));
    }

    function jobLabel(station) {
      if (station === "off") return `Not on ${bench.label}`;
      return stationInfo(station)?.label || station;
    }

    function benchPeople(phase, assignments = state.assignments) {
      return assignments.filter(item => item.phase === phase && isBenchStation(item.station));
    }

    function sentHomeToday() {
      return new Set(state.events
        .filter(event => event.kind === "removed" && String(event.message || "").includes(SICK_REASON))
        .map(event => event.staffKey));
    }

    // People who are in, free this phase, and can do at least one job here.
    function availablePeople(phase) {
      const busy = new Set(state.assignments.filter(item => item.phase === phase).map(item => item.staffKey));
      const sent = sentHomeToday();
      const entries = state.roster?.entries || null;
      const jobs = benchJobs();
      return [...state.staff.entries()]
        .filter(([, person]) => jobs.some(job => canDo(person, job.station)))
        .filter(([key]) => entries?.[key]?.available !== false)   // in unless marked away
        .filter(([key]) => !busy.has(key) && !sent.has(key))
        .sort(([a, pa], [b, pb]) => benchLevel(pb) - benchLevel(pa) || staffName(a).localeCompare(staffName(b)))
        .map(([key]) => key);
    }

    // ------------------------------------------------------------------
    // Capacity: the build speeds from the Rates tab (js/lists.js), the
    // same numbers the Management screen plans with. Each takes a batch's
    // unit / comms list key. Each bench works out its own limit from who is
    // on its jobs now; the day target is the lowest of the planned target
    // and every bench's limit.
    // ------------------------------------------------------------------
    // Each block has its own length (Rates tab), so each takes the block.
    const dailyLimit = commsKey => testingPerDay(commsKey);
    const assemblyPerBench = (unitKey, block = "start") => assemblyRate(unitKey, block);
    const hardwareCapacity = (benches, unitKey, commsKey, block = "second") => hardwareRate(benches, unitKey, commsKey, block);
    const packingCapacity = (benches, unitKey, block = "second") => packagingBuildRate(benches, unitKey, block);

    function capacityInteger(value) {
      const safe = Math.max(0, Number(value) || 0);
      const nearest = Math.round(safe);
      return Math.abs(safe - nearest) < 0.02 ? nearest : Math.floor(safe);
    }

    // Single build: each tester tests on a bench of their own (up to the
    // number of benches), each bench testing 2 units at a time (Rates tab).
    // Mixed day: each network needs its testing time; one tester on a
    // network for a phase gives one phase of time, up to two phases.
    function testingCapacity(plan, assignments) {
      const batches = activeBatches(plan);
      if (!batches.length) return 0;
      const onStation = (phase, station) => assignments.filter(item => item.phase === phase && item.station === station).length;

      if (plan.productsDay) return scaledLimit("testing", ["testing", "testingVerizon", "testingGlobal"], plan, assignments);

      if (plan.workMode !== "mixed") {
        const max = dailyLimit(commsKeyOf(batches[0]));
        const total = PHASE_KEYS.reduce((sum, phase) => sum + testingInBlock(commsKeyOf(batches[0]), phase, onStation(phase, "testing")), 0);
        return Math.min(max, total);
      }

      const requested = batches.reduce((sum, batch) => sum + Number(batch.quantity), 0);
      const ratios = ["verizon", "global"]
        .filter(network => batches.some(batch => networkOf(batch) === network))
        .map(network => {
          const demand = batches
            .filter(batch => networkOf(batch) === network)
            .reduce((sum, batch) => sum + (Number(batch.quantity) / dailyLimit(commsKeyOf(batch))) * 2, 0);
          const activePhases = PHASE_KEYS.filter(phase => onStation(phase, NETWORKS[network].station) > 0).length;
          return demand <= 0 ? 1 : Math.max(0, Math.min(1, Math.min(2, activePhases) / demand));
        });
      return capacityInteger(requested * Math.min(1, ...ratios));
    }

    // Mixed or products day: what a stage could do at release, scaled by
    // how many people are on its jobs now compared with then.
    function scaledLimit(key, stations, plan, assignments) {
      const planned = Number(plan.snapshot?.capacity?.stages?.[key]);
      if (!Number.isFinite(planned)) return null;
      const releasedOn = list => PHASE_KEYS.reduce((sum, phase) => sum + (plan.snapshot?.phases?.[phase] || [])
        .filter(task => onList(list, task.station))
        .reduce((inner, task) => inner + (task.workers?.length || 0), 0), 0);
      const nowOn = list => PHASE_KEYS.reduce((sum, phase) =>
        sum + assignments.filter(item => item.phase === phase && onList(list, item.station)).length, 0);
      if (key === "assembly" && releasedOn(["subAssembly"]) > 0 && nowOn(["subAssembly"]) === 0) return 0;
      const before = releasedOn(stations);
      if (!before) return planned;
      return Math.floor(planned * Math.min(1, nowOn(stations) / before));
    }

    const CAPACITY_STATIONS = {
      assembly: ["assembly", "assemblyGen4", "assemblyTap"],
      hardware: ["hardware"],
      packing: ["packing"]
    };

    // A bench's limit in units, or null when it has no limit of its own.
    function benchLimit(key, plan, assignments) {
      if (key === "testing") return testingCapacity(plan, assignments);
      const stations = CAPACITY_STATIONS[key];
      if (!stations) return null;
      const batches = activeBatches(plan);
      if (!batches.length) return 0;
      const count = (phase, list) => assignments.filter(item => item.phase === phase && onList(list, item.station)).length;

      if (plan.workMode !== "mixed") {
        const unitKey = unitKeyOf(batches[0]);
        const commsKey = commsKeyOf(batches[0]);
        return PHASE_KEYS.reduce((sum, phase) => {
          const benches = count(phase, stations);
          if (key === "assembly") return sum + (count(phase, ["subAssembly"]) > 0 ? benches * assemblyPerBench(unitKey, phase) : 0);
          if (key === "hardware") return sum + hardwareCapacity(benches, unitKey, commsKey, phase);
          return sum + packingCapacity(benches, unitKey, phase);
        }, 0);
      }

      return scaledLimit(key, stations, plan, assignments);
    }

    // ------------------------------------------------------------------
    // Loading and live updates
    // ------------------------------------------------------------------
    async function loadReference() {
      const [staff, presets] = await Promise.all([
        getDocs(collection(db, "staff")),
        getDocs(collection(db, "configPresets"))
      ]);
      state.staff = new Map(staff.docs.map(entry => [entry.id, entry.data()]));
      state.presets = Object.fromEntries(presets.docs.map(entry => [entry.id, entry.data()]));
    }

    function stopDetails() {
      detailStops.forEach(stop => stop());
      detailStops = [];
    }

    function stopAll() {
      stopDetails();
      stops.forEach(stop => stop());
      stops = [];
      clearTimeout(retryTimer);
    }

    function openDate(date) {
      stopAll();
      board?.clearSelection();
      Object.assign(state, { date, plan: null, reachable: true, assignments: [], events: [], roster: null, nextPlan: null, progress: new Map(), notes: [], requests: [], requestsLoaded: false, messages: [], messagesLoaded: false, followClock: true });
      state.phase = date === toInputDate(new Date()) ? currentBlock() : "start";
      $("dateInput").value = date;
      render();

      getDoc(doc(db, "rosters", date))
        .then(snapshot => {
          if (state.date !== date) return;
          state.roster = snapshot.exists() ? snapshot.data() : null;
          render();
        })
        .catch(() => {});

      stops.push(onSnapshot(doc(db, "plans", date), { includeMetadataChanges: true }, snapshot => {
        if (state.date !== date) return;
        const plan = snapshot.exists() ? snapshot.data() : null;
        const released = plan?.status === "released";
        state.plan = released ? plan : null;
        state.reachable = true;
        state.live = !snapshot.metadata.fromCache;
        if (released && detailStops.length === 0) watchDetails(date);
        if (!released) {
          stopDetails();
          state.assignments = [];
          state.events = [];
          lookForNextPlan(date);
        }
        render();
      }, error => {
        if (state.date !== date) return;
        // Bench screens can't read a plan until it's released ("permission
        // denied" just means not released yet): check again shortly.
        state.plan = null;
        state.reachable = error?.code === "permission-denied";
        state.live = state.reachable;
        render();
        if (state.reachable) lookForNextPlan(date);
        retryTimer = setTimeout(() => {
          if (state.date === date) openDate(date);
        }, 60000);
      }));
    }

    // When a day has no plan, find the next released one (up to two weeks on).
    async function lookForNextPlan(fromDate) {
      if (state.nextPlan?.from === fromDate) return;
      state.nextPlan = { from: fromDate, date: null, searching: true };
      const start = fromInputDate(fromDate);
      let found = null;
      for (let day = 1; day <= 14 && !found; day++) {
        const next = new Date(start);
        next.setDate(start.getDate() + day);
        const key = toInputDate(next);
        try {
          const snapshot = await getDoc(doc(db, "plans", key));
          if (snapshot.exists() && snapshot.data().status === "released") found = key;
        } catch {
          // Not released yet (benches can't see drafts): keep looking.
        }
        if (state.date !== fromDate) return;
      }
      state.nextPlan = { from: fromDate, date: found, searching: false };
      render();
    }

    function watchDetails(date) {
      detailStops.push(onSnapshot(collection(db, "plans", date, "assignments"), snapshot => {
        if (state.date !== date) return;
        state.assignments = snapshot.docs.map(entry => ({ id: entry.id, ...entry.data() }));
        render();
      }, () => {}));
      detailStops.push(watchRequests(date, list => {
        if (state.date !== date) return;
        announceRequestChanges(list);
        state.requests = list;
        state.requestsLoaded = true;
        render();
      }));
      detailStops.push(watchMessages(date, list => {
        if (state.date !== date || !list) return;
        const known = new Set(state.messages.map(message => message.id));
        const fresh = state.messagesLoaded
          ? list.filter(message => !known.has(message.id) && message.role !== state.role && (message.bench === benchKey || message.bench === "all"))
          : [];
        state.messages = list;
        state.messagesLoaded = true;
        if (fresh.length) toast(`Note from Management: ${fresh[0].text}`);
        render();
      }));
      detailStops.push(watchFloor(date, ({ progress, notes }) => {
        if (state.date !== date) return;
        state.progress = progress;
        state.notes = notes;
        render();
      }));
      detailStops.push(onSnapshot(
        query(collection(db, "plans", date, "events"), orderBy("createdAt", "desc"), limit(60)),
        snapshot => {
          if (state.date !== date) return;
          state.events = snapshot.docs.map(entry => entry.data());
          render();
        },
        () => {}
      ));
    }

    // ------------------------------------------------------------------
    // Rendering
    // ------------------------------------------------------------------
    function render() {
      if (board?.isDragging()) {
        renderPending = true;
        return;
      }
      renderPending = false;

      $("benchTitle").textContent = bench.label;
      $("dateLabel").textContent = state.date ? cellDate(state.date) : "";
      const badge = $("liveBadge");
      badge.textContent = state.live ? "Live" : "Offline";
      badge.classList.toggle("offline", !state.live);

      const hasPlan = Boolean(state.plan);
      $("emptyState").classList.toggle("hidden", hasPlan);
      $("planArea").classList.toggle("hidden", !hasPlan);
      if (!hasPlan) {
        $("tbTarget").textContent = "–";
        renderEmpty();
        return;
      }

      renderBlockTabs();
      renderActions();
      renderRequests();
      renderJobCard();
      renderTeam();
      renderGuides();
      renderMessages();
      renderSummary();
      renderBatchStatuses();
      renderPinned();
      renderNotes();
      renderInfo();
      renderBoard();
      renderEvents();
    }

    function renderEmpty() {
      $("emptyMessage").textContent = state.reachable
        ? "Not released yet."
        : "Offline: can't reach the database.";
      const next = state.nextPlan;
      const holder = $("nextPlan");
      const show = Boolean(next && next.from === state.date && state.reachable);
      holder.classList.toggle("hidden", !show);
      if (!show) return;
      if (next.searching) {
        holder.innerHTML = `<span class="hint">Looking for the next released plan…</span>`;
      } else if (next.date) {
        holder.innerHTML = `<span>Next released plan: <strong>${escapeHtml(longDate(next.date))}</strong></span>
          <button type="button" data-open-date="${escapeHtml(next.date)}">Open it</button>`;
      } else {
        holder.innerHTML = `<span class="hint">No released plans in the next two weeks.</span>`;
      }
    }

    function renderSummary() {
      const plan = state.plan;
      const planned = plan.plannedTarget ?? 0;
      const current = plan.currentTarget ?? planned;
      const batches = activeBatches();
      const people = [...new Set(state.assignments.filter(item => isBenchStation(item.station)).map(item => item.staffKey))];
      const totalUnits = batches.reduce((sum, batch) => sum + plannedUnits(batch), 0);
      const byUnit = [...new Set(batches.map(unitKeyOf))]
        .map(unit => [unit, batches.filter(batch => unitKeyOf(batch) === unit).reduce((sum, batch) => sum + plannedUnits(batch), 0)])
        .filter(([, units]) => units > 0)
        .map(([unit, units]) => `${labelOf("units", unit)} ${units}`);

      $("tbTarget").innerHTML = current < planned ? `${current} <small>of ${planned}</small>` : String(current);
      $("tbTarget").classList.toggle("down", current < planned);

      let middle;
      if (benchKey === "testing") {
        const byNetwork = ["verizon", "global"]
          .map(network => [network, batches.filter(batch => networkOf(batch) === network).reduce((sum, batch) => sum + plannedUnits(batch), 0)])
          .filter(([, units]) => units > 0)
          .map(([network, units]) => `${NETWORKS[network].label} ${units}`);
        middle = `
          <div class="stat">
            <div class="label">Units to test</div>
            <div class="value small-value">${escapeHtml(byNetwork.join(" · ") || "None")}</div>
          </div>`;
      } else {
        middle = `
          <div class="stat">
            <div class="label">${benchKey === "cage" ? "Units to release parts for" : "Units today"}</div>
            <div class="value">${totalUnits}</div>
            <div class="note">${escapeHtml(byUnit.join(" · ") || "None")} · ${batches.length} batch${batches.length === 1 ? "" : "es"}</div>
          </div>`;
      }

      const last = hasBoard
        ? `
          <div class="stat">
            <div class="label">On ${escapeHtml(bench.label)} today</div>
            <div class="value">${people.length}</div>
            <div class="note">${escapeHtml(people.map(staffName).join(", ") || "Nobody assigned")}</div>
          </div>`
        : "";

      $("summary").innerHTML = middle + last;
    }

    // ------------------------------------------------------------------
    // The one-screen bench: the block, its job, the team and notes
    // ------------------------------------------------------------------
    const isToday = () => state.date === toInputDate(new Date());

    function renderBlockTabs() {
      const now = isToday() ? currentBlock() : null;
      $("blockTabs").innerHTML = PHASES.map(([phase, label]) => `
        <button type="button" role="tab" data-block="${phase}" class="${phase === state.phase ? "active" : ""} ${phase === now ? "now" : ""}" aria-selected="${phase === state.phase}">
          <b>${escapeHtml(label)}</b><span>${escapeHtml(blockClockLabel(phase))}</span>
        </button>`).join("");
    }

    // Who the plan put on a job in a block (at release).
    function plannedOn(phase, station) {
      return (state.plan?.snapshot?.phases?.[phase] || [])
        .filter(task => task.station === station)
        .flatMap(task => task.workers || []);
    }

    // What some people on a job can do in a block (the bench's rates).
    function stationCapacity(station, phase, count) {
      const batches = activeBatches();
      const product = productOf(station);
      const lead = batches.find(batch => !product || unitKeyOf(batch) === product) || batches[0];
      if (!lead || count <= 0) return 0;
      const unit = product || unitKeyOf(lead);
      const base = baseOf(station);
      if (station === "subAssembly") return count * subAssemblyRate(unit, phase);
      if (base === "assembly" || station === "assemblyGen4" || station === "assemblyTap") return count * assemblyRate(unit, phase);
      if (product && base === "testing") return count * testingRate(unit, phase);
      if (station === "testingVerizon" || station === "testingGlobal" || station === "testing") {
        const network = STATIONS[station]?.network;
        const batch = network ? batches.find(item => usesComms(item) && networkOf(item) === network) || lead : lead;
        return testingInBlock(commsKeyOf(batch), phase, count);
      }
      if (station === "hardware") return hardwareRate(count, unit, commsKeyOf(lead), phase);
      if (station === "packing") return packagingBuildRate(count, unit, phase);
      if (station === "finalPackaging") return packingRate(count, unit, phase);
      return null;
    }

    // A job's colour, as on the plan picture.
    const JOB_COLOURS = { subAssembly: "#7a5bb5", assembly: "#c2453b", testing: "#3f7fbf", hardware: "#3f8f4e", packing: "#c75b74", finalPackaging: "#d39d12" };
    const jobColour = station => JOB_COLOURS[station] || JOB_COLOURS[baseOf(station)]
      || (station === "assemblyGen4" || station === "assemblyTap" ? JOB_COLOURS.assembly : station === "testingVerizon" || station === "testingGlobal" ? JOB_COLOURS.testing : null);

    // The batches a job works on (its unit, or its network for testing).
    function stationBatches(station) {
      const product = productOf(station);
      const network = STATIONS[station]?.network;
      return activeBatches().filter(batch => (!product || unitKeyOf(batch) === product)
        && (!network || (usesComms(batch) && networkOf(batch) === network))
        && (station !== "assemblyGen4" || batch.unitType !== "tap")
        && (station !== "assemblyTap" || batch.unitType === "tap"));
    }

    // The units a job works on ("Solar", "Gen4 & Tap").
    function stationUnits(station) {
      const product = productOf(station);
      if (product) return labelOf("units", product);
      const network = STATIONS[station]?.network;
      const batches = activeBatches().filter(batch => !network || (usesComms(batch) && networkOf(batch) === network));
      return [...new Set(batches.map(unitKeyOf))].map(key => labelOf("units", key)).join(" & ");
    }

    /* What a job builds: with one unit, its name for the big line and its
       specs underneath ("Gen4" / "2-Pin Metal, Verizon, SCE"); with more,
       no name on the big line and a line per build, with its count when
       they add up to the job's target ("12 Solar · AEP"). */
    function stationBuilds(station, target) {
      const batches = stationBatches(station);
      const units = [...new Set(batches.map(unitKeyOf))];
      const spec = batch => [
        batch.connectorKey ? labelOf("connectors", batch.connectorKey) : "",
        usesComms(batch) ? labelOf("comms", commsKeyOf(batch)) : "",
        batch.customer || ""
      ].filter(Boolean).join(", ");
      if (units.length <= 1) {
        return { unit: units.length ? labelOf("units", units[0]) : "", lines: [...new Set(batches.map(spec).filter(Boolean))] };
      }
      const counted = batches.reduce((sum, batch) => sum + plannedUnits(batch), 0) === target;
      return {
        unit: "",
        lines: batches.map(batch => [`${counted ? `${plannedUnits(batch)} ` : ""}${labelOf("units", unitKeyOf(batch))}`, spec(batch)].filter(Boolean).join(" · "))
      };
    }

    // The big line: "Build 36 Gen4", "Test 36 Gen4", "Make 24 Solar sets".
    function simpleHeadline(station, target, units = stationUnits(station)) {
      const base = baseOf(station);
      const text = station === "subAssembly" ? `Make ${target} ${units} sets`
        : base === "assembly" || station === "assemblyGen4" || station === "assemblyTap" ? `Build ${target} ${units}`
        : base === "testing" || station === "testingVerizon" || station === "testingGlobal" ? `Test ${target} ${units}`
        : station === "hardware" ? `Check ${target} ${units}`
        : station === "packing" ? `Build up ${target} ${units} boxes`
        : station === "finalPackaging" ? `Pack ${target} ${units}`
        : `${target} ${units}`;
      return text.replace(/\s+/g, " ").trim();
    }

    // "Build 24 Solar units", with the plan's wordings it makes redundant.
    function requestText(station, target) {
      const units = stationUnits(station);
      const base = baseOf(station);
      const text = station === "subAssembly" ? `Make ${target} ${units} sets for tomorrow`
        : base === "assembly" || station === "assemblyGen4" || station === "assemblyTap" ? `Build ${target} ${units} units`
        : base === "testing" || station === "testingVerizon" || station === "testingGlobal" ? `Test ${target} ${units} units`
        : station === "hardware" ? `Check ${target} ${units} units`
        : station === "packing" ? `Build up ${target} ${units} boxes`
        : station === "finalPackaging" ? `Pack ${target} ${units} units`
        : `${target} ${units}`;
      return { text: text.replace(/\s+/g, " "), repeats: [`${target} ${units}`, `${target} ${units} for tomorrow`] };
    }

    // "24 total · 4 each" (or 4–5 each); Hardware Check: every unit gets all its checks.
    function eachText(station, target, people) {
      if (station === "hardware") {
        const unit = activeBatches()[0];
        return `${target} total · ${unit ? hardwareChecks(unitKeyOf(unit)) : 3} checks per unit`;
      }
      if (!people) return `${target} total`;
      const low = Math.floor(target / people);
      const high = Math.ceil(target / people);
      return `${target} total · ${low === high ? low : `${low}–${high}`} each`;
    }

    // Guide pictures for this bench and today's units, as cards to tap open.
    function renderGuides() {
      const units = new Set(activeBatches().map(unitKeyOf));
      const mine = state.guides
        .filter(guide => guide.bench === benchKey && (guide.unit === "all" || units.has(guide.unit)))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.title).localeCompare(String(b.title)));
      $("guidesCard").classList.toggle("hidden", !mine.length);
      $("guideCards").innerHTML = mine.map(guide => `
        <button type="button" class="guide-card" data-guide="${escapeHtml(guide.id)}" aria-label="Open ${escapeHtml(guide.title)}">
          <img src="${escapeHtml(guide.image)}" alt="" />
          <span>${escapeHtml(guide.title)}</span>
        </button>`).join("");
    }

    function openGuide(id) {
      const guide = state.guides.find(item => item.id === id);
      if (!guide) return;
      const view = document.createElement("div");
      view.className = "guide-view";
      view.setAttribute("role", "dialog");
      view.setAttribute("aria-label", guide.title);
      view.innerHTML = `<img src="${escapeHtml(guide.image)}" alt="${escapeHtml(guide.title)}" />`;
      view.addEventListener("click", () => view.remove());
      document.body.appendChild(view);
    }

    // The job card: each job of this bench in the block on screen, with its
    // target, then the day's orders and the Hit target / Enter number buttons.
    function renderJobCard() {
      const figures = state.plan.snapshot?.figures?.[state.phase] || null;
      const people = station => benchPeople(state.phase).filter(item => item.station === station).length;
      const jobs = benchJobs().filter(job => people(job.station) || figures?.[job.station]);
      const simple = true;   // every bench: the request in big type, specs underneath
      const lines = jobs.map(job => {
        const figure = figures?.[job.station] || null;
        const onIt = people(job.station);
        const planned = plannedOn(state.phase, job.station).length;
        const can = figure && onIt !== planned ? stationCapacity(job.station, state.phase, onIt) : null;
        const short = can !== null && figure && can < figure.target;
        if (simple && figure) {
          // Build 36 Gen4 · 6 each, then the specs.
          const low = onIt ? Math.floor(figure.target / onIt) : null;
          const high = onIt ? Math.ceil(figure.target / onIt) : null;
          const each = job.station === "hardware"
            ? `${hardwareChecks(unitKeyOf(stationBatches(job.station)[0] || {}))} checks per unit`
            : onIt ? `${low === high ? low : `${low}–${high}`} each` : "";
          const builds = stationBuilds(job.station, figure.target);
          const specs = [job.station === "subAssembly" ? "For tomorrow" : "", ...builds.lines].filter(Boolean);
          return `
            <div class="job-line simple">
              <div class="job-headline">
                <span class="job-big">${escapeHtml(simpleHeadline(job.station, figure.target, builds.unit))}</span>
                ${each ? `<span class="job-each-inline">${escapeHtml(each)}</span>` : ""}
              </div>
              ${specs.map(line => `<div class="job-specs">${escapeHtml(line)}</div>`).join("")}
              ${figure.spare ? `<div class="job-specs">Then build up ${figure.spare} boxes</div>` : ""}
              ${short ? `<span class="job-now">Now ${can} with ${onIt} ${onIt === 1 ? "person" : "people"}</span>` : ""}
            </div>`;
        }
        const request = figure ? requestText(job.station, figure.target) : null;
        // The plan's own wording only when it says more than the request.
        const what = figure?.text && !request.repeats.includes(figure.text) ? figure.text : "";
        return `
          <div class="job-line">
            <span class="job-station">${escapeHtml(job.label)}</span>
            ${request
              ? `<span class="job-request"><span class="job-request-label">Request:</span> ${escapeHtml(request.text)}</span>
                 <span class="job-each">${escapeHtml(eachText(job.station, figure.target, onIt))}</span>`
              : `<span class="job-request">${onIt} on</span>`}
            ${what ? `<span class="job-what">${escapeHtml(what)}</span>` : ""}
            ${figure?.spare ? `<span class="job-then">Then Packaging build-up: ${figure.spare} boxes</span>` : ""}
            ${short ? `<span class="job-now">Now ${can} with ${onIt} ${onIt === 1 ? "person" : "people"}</span>` : ""}
          </div>`;
      });

      const orders = (state.plan.snapshot?.orders || []).filter(order => order.quantity > 0);
      const ordersHtml = orders.length && benchKey !== "cage" && !simple
        ? `<div class="job-orders">${orders.map(order => `<div>${escapeHtml(order.customer)} · ${escapeHtml(labelOf("units", order.unitKey))}${order.built !== null ? ` · <b>${order.built} / ${order.quantity}</b> built` : ` · ${order.quantity}`}</div>`).join("")}</div>`
        : "";

      // Hit target / Enter number for each batch this bench works on.
      const cage = benchKey === "cage";
      const batches = floorBatches(state.plan).filter(batch => onRoute(batch, benchKey));
      const statusHtml = batches.length ? `
        <div class="job-status">${batches.map(batch => {
          const item = progressOf(state.progress, benchKey, batch);
          const expected = expectedUnits(state.progress, benchKey, batch);
          const buttons = [];
          if (item.status === "waiting" || item.status === "in_progress") buttons.push(`<button type="button" data-set="hit" data-batch="${escapeHtml(batch.key)}">${cage ? "Released" : "Hit target"}</button>`);
          buttons.push(`<button type="button" class="secondary" data-set="short" data-batch="${escapeHtml(batch.key)}">${item.status === "short" ? "Change number" : cage ? "Released fewer" : "Enter number"}</button>`);
          if (item.status !== "waiting") buttons.push(`<button type="button" class="secondary" data-set="waiting" data-batch="${escapeHtml(batch.key)}">Undo</button>`);
          // Simple card: no "Waiting"; the batch is named only when there's more than one.
          const label = simple
            ? [batches.length > 1 ? batchTitle(batch) : "", item.status !== "waiting" ? statusText(benchKey, item, expected) : ""].filter(Boolean).join(" · ")
            : `${batchTitle(batch)} · ${statusText(benchKey, item, expected)}`;
          return `
            <div class="job-status-row">
              <span class="job-status-text">${escapeHtml(label)}</span>
              ${buttons.join("")}
            </div>`;
        }).join("")}</div>` : "";

      $("jobCard").innerHTML = `
        ${simple ? "" : `<div class="bench-card-head"><h2>${escapeHtml(phaseLabel(state.phase))}</h2></div>`}
        ${lines.join("") || (cage ? "" : '<p class="empty">Nothing on this bench this block.</p>')}
        ${ordersHtml}
        ${statusHtml}`;
    }

    // The team this block: everyone on each job, ticked. Untick to take
    // someone off (with a reason); people the plan put here who are off
    // show unticked, to tick back on.
    function renderTeam() {
      const jobs = benchJobs();
      $("benchMain").classList.toggle("no-team", !hasBoard);
      $("teamPanel").classList.toggle("hidden", !hasBoard);
      if (!hasBoard) return;
      const sent = sentHomeToday();
      const groups = jobs.map(job => {
        const on = benchPeople(state.phase).filter(item => item.station === job.station).map(item => item.staffKey);
        const off = plannedOn(state.phase, job.station).filter(key => !on.includes(key));
        if (!on.length && !off.length) return "";
        const elsewhere = key => {
          const now = jobFor(key, state.phase);
          return now ? jobLabel(now.station) : sent.has(key) ? "Sick" : "Off";
        };
        const colour = jobColour(job.station);
        return `
          <div class="team-group">
            <h3${colour ? ` style="--job:${colour}"` : ""}>${escapeHtml(job.label)}</h3>
            <div class="team-list">
              ${on.map(key => `<label class="team-person"><input type="checkbox" checked data-team-off="${escapeHtml(key)}" data-station="${escapeHtml(job.station)}" />${escapeHtml(personName(key))}</label>`).join("")}
              ${off.map(key => {
                const busyElsewhere = Boolean(jobFor(key, state.phase));
                return `<label class="team-person off"><input type="checkbox" ${busyElsewhere ? "disabled" : ""} data-team-on="${escapeHtml(key)}" data-station="${escapeHtml(job.station)}" />${escapeHtml(personName(key))}<small>${escapeHtml(elsewhere(key))}</small></label>`;
              }).join("")}
            </div>
          </div>`;
      }).join("");
      $("teamPanel").innerHTML = `
        <div class="bench-card-head"><h2>Team · ${escapeHtml(phaseLabel(state.phase))}</h2></div>
        ${groups ? `<div class="team-groups">${groups}</div>` : '<p class="team-empty">Nobody on this bench this block.</p>'}`;
    }

    function renderMessages() {
      const mine = state.messages.filter(message => message.bench === benchKey || message.bench === "all");
      const planNote = String(state.plan.notes || "").trim();
      const fromPlan = planNote ? `
        <div class="msg from-management">
          <div class="msg-head"><span class="msg-tag">Plan</span><span class="msg-who">Management</span></div>
          <div class="msg-text">${escapeHtml(planNote)}</div>
        </div>` : "";
      $("messageList").innerHTML = mine.map(message => messageHtml(message, state.role)).join("") + fromPlan
        || '<p class="empty">No notes.</p>';
    }

    async function writeMessage() {
      const note = await askMessage({ title: `Note · ${bench.label}` });
      if (!note) return;
      try {
        await addMessage(state.date, { ...note, bench: benchKey }, state.role, ACTOR);
      } catch (error) {
        toast(`That note wasn't saved: ${friendlyError(error)}`, true);
      }
    }

    async function seenMessage(id) {
      try {
        await markMessageSeen(state.date, id, ACTOR);
      } catch (error) {
        toast(`That wasn't saved: ${friendlyError(error)}`, true);
      }
    }

    // ------------------------------------------------------------------
    // Request buttons: help, stock and faulty (the cage has no stock button)
    // ------------------------------------------------------------------
    const BENCH_ACTIONS = { cage: ["help", "faulty"] };

    function renderActions() {
      const actions = BENCH_ACTIONS[benchKey] || ["help", "stock", "faulty"];
      const waiting = kind => state.requests.filter(request => request.bench === benchKey && request.kind === kind && request.status !== "done").length;
      $("actionBar").innerHTML = actions.map(kind => {
        const count = waiting(kind);
        return `<button type="button" class="action ${kind}" data-action="${kind}">${REQUEST_KINDS[kind].icon}<span>${escapeHtml(REQUEST_KINDS[kind].label)}</span>${count ? `<b class="action-count" aria-label="${count} open">${count}</b>` : ""}</button>`;
      }).join("");
    }

    // What this screen can do with a request.
    function requestActionFor(request) {
      if (request.status === "done") return null;
      if (benchKey === "cage" && request.kind === "stock" && request.status === "open") return { label: "Send", to: "accepted" };
      if (request.bench !== benchKey) return null;
      if (request.kind === "stock" && request.status === "accepted") return { label: "Received", to: "done" };
      if (request.kind === "help") return { label: "Resolved", to: "done" };
      return null;
    }

    function renderRequests() {
      const cage = benchKey === "cage";
      const list = state.requests.filter(request => cage ? request.kind === "stock" || request.bench === "cage" : request.bench === benchKey);
      $("requestsCard").classList.toggle("hidden", !list.length);
      $("requestsTitle").textContent = cage ? "Stock requests" : "Requests";
      const ordered = [...list].sort((a, b) => Number(a.status === "done") - Number(b.status === "done"));
      $("requestList").innerHTML = ordered.map(request => requestCardHtml(request, requestActionFor)).join("");
    }

    // Tell the bench when something it asked for moves on (or, for the
    // cage, when a new order comes in).
    function announceRequestChanges(list) {
      if (!state.requestsLoaded) return;
      const before = new Map(state.requests.map(request => [request.id, request.status]));
      list.forEach(request => {
        const kind = REQUEST_KINDS[request.kind];
        if (!kind) return;
        const was = before.get(request.id);
        if (benchKey === "cage" && request.kind === "stock" && was === undefined) {
          toast(`Stock request: ${requestTitle(request)}`);
        } else if (request.bench === benchKey && was && was !== request.status) {
          toast(`${requestTitle(request)}: ${kind.status[request.status]}`);
        }
      });
    }

    async function makeBenchRequest(kind) {
      const batches = floorBatches(state.plan).map(batch => ({ key: batch.key, title: batchTitle(batch) }));
      const fields = kind === "help" ? await askHelp() : kind === "stock" ? await askStock() : await askFaulty(batches);
      if (!fields) return;
      try {
        await makeRequest(state.date, { ...fields, bench: benchKey }, ACTOR);
        await logEvent({ kind: "note", message: `${bench.label}: ${REQUEST_KINDS[kind].label} · ${requestTitle(fields)}` });
        toast(kind === "help" ? "Help requested" : kind === "stock" ? "Stock requested" : "Fault reported");
      } catch (error) {
        toast(`That wasn't sent: ${friendlyError(error)}`, true);
      }
    }

    async function moveBenchRequest(id, to) {
      const request = state.requests.find(item => item.id === id);
      if (!request || !["open", "accepted", "done"].includes(to)) return;
      try {
        await moveRequest(state.date, request, to, ACTOR);
        await logEvent({ kind: "note", message: `${bench.label}: ${requestTitle(request)} · ${REQUEST_KINDS[request.kind].status[to]}` });
      } catch (error) {
        toast(`That wasn't saved: ${friendlyError(error)}`, true);
      }
    }

    // This bench's sticky note for each batch, with big buttons to update it.
    function renderBatchStatuses() {
      const cage = benchKey === "cage";
      const batches = floorBatches(state.plan).filter(batch => onRoute(batch, benchKey));
      $("batchesTitle").textContent = cage ? "Release status" : "Your batches";
      $("batchStatuses").innerHTML = batches.map(batch => {
        const item = progressOf(state.progress, benchKey, batch);
        const buttons = [];
        if (item.status === "waiting") buttons.push(`<button type="button" data-set="in_progress" data-batch="${escapeHtml(batch.key)}">${cage ? "Releasing" : "Start"}</button>`);
        if (item.status === "waiting" || item.status === "in_progress") {
          buttons.push(`<button type="button" data-set="hit" data-batch="${escapeHtml(batch.key)}">${cage ? "Released" : "Hit target"}</button>`);
        }
        buttons.push(`<button type="button" class="secondary" data-set="short" data-batch="${escapeHtml(batch.key)}">${item.status === "short" ? "Change number" : cage ? "Released fewer" : "Enter number"}</button>`);
        if (item.status !== "waiting") buttons.push(`<button type="button" class="secondary" data-set="waiting" data-batch="${escapeHtml(batch.key)}">Undo</button>`);
        return `
          <div class="batch-status">
            ${statusNoteHtml({ bench: benchKey, batch, progress: state.progress, presets: state.presets })}
            <div class="batch-actions">${buttons.join("")}</div>
          </div>`;
      }).join("") || '<p class="empty">No batches in this plan.</p>';

      // Cards waiting here from earlier days, not on today's plan here.
      const current = state.date >= toInputDate(new Date());
      const waiting = current ? waitingJobsAt(state.waitingJobs, state.plan, benchKey) : [];
      if (waiting.length) {
        $("batchStatuses").insertAdjacentHTML("beforeend", `
          <h3 class="waiting-here">Waiting here</h3>
          ${waiting.map(job => `<div class="batch-status">${waitingJobHtml(job, { presets: state.presets })}</div>`).join("")}`);
      }
    }

    function renderPinned() {
      const notes = state.notes.filter(note => note.bench === benchKey || note.bench === "all");
      $("pinnedNotes").innerHTML = notes.map(note => pinnedNoteHtml(note, state.role)).join("")
        || '<p class="empty">Nothing pinned.</p>';
    }

    async function setStatus(batchKey, status) {
      const batch = floorBatches(state.plan).find(item => item.key === batchKey);
      if (!batch || state.busy) return;
      const expected = expectedUnits(state.progress, benchKey, batch);
      let done = null;
      if (status === "hit") done = expected;
      if (status === "short") {
        done = await askUnitsDone({ title: `${bench.label}: ${batchTitle(batch)}`, expected });
        if (done === null) return;
        if (done >= expected) status = "hit";
      }
      state.busy = true;
      try {
        await setBatchStatus(state.date, benchKey, batch, status, done, ACTOR, expected);
        const text = statusText(benchKey, { status, done }, expected);
        await logEvent({ kind: "note", message: `${bench.label} · ${batchTitle(batch)}: ${text}.` });
      } catch (error) {
        toast(`That wasn't saved: ${friendlyError(error)}`, true);
      } finally {
        state.busy = false;
        render();
      }
    }

    async function pinNote() {
      const result = await askNote({
        title: `Pin a note`,
        bench: benchKey,
        benches: [{ key: benchKey, label: bench.label }, { key: "all", label: "Everyone" }]
      });
      if (!result) return;
      try {
        await addNote(state.date, result, state.role, ACTOR);
      } catch (error) {
        toast(`That note wasn't pinned: ${friendlyError(error)}`, true);
      }
    }

    async function changeNote(noteId) {
      const note = state.notes.find(item => item.id === noteId);
      if (!note) return;
      const result = await askNote({
        title: "Edit note",
        note,
        benches: [{ key: benchKey, label: bench.label }, { key: "all", label: "Everyone" }]
      });
      if (!result) return;
      try {
        await editNote(state.date, note, result, state.role, ACTOR);
      } catch (error) {
        toast(`That change wasn't saved: ${friendlyError(error)}`, true);
      }
    }

    async function deleteNote(noteId) {
      const note = state.notes.find(item => item.id === noteId);
      if (!note || !window.confirm("Remove this note?")) return;
      try {
        await removeNote(state.date, note);
      } catch (error) {
        toast(`That note wasn't removed: ${friendlyError(error)}`, true);
      }
    }

    function renderNotes() {
      const notes = String(state.plan.notes || "").trim();
      $("notesCard").classList.toggle("hidden", !notes);
      $("notesText").textContent = notes;
    }

    function renderInfo() {
      if (benchKey === "testing") {
        $("infoTitle").textContent = "Network setups";
        $("info").innerHTML = `<div class="setup-grid">${testingSetupsHtml()}</div>`;
        return;
      }
