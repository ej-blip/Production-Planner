      $("infoTitle").textContent = benchKey === "cage" ? "Release for today's builds" : "What we're building";
      $("info").innerHTML = batchTableHtml(bench.columns);
    }

    function presetFor(batch) {
      return state.presets[batch.configKey] || null;
    }

    function batchTableHtml(columns) {
      const batches = activeBatches();
      if (!batches.length) return '<p class="empty">No batches in this plan.</p>';
      const headings = {
        customer: "Customer", unit: "Unit", network: "Network · SIM", connector: "Connector",
        config: "Configuration", setup: "Component setup", units: "Units"
      };
      const cell = (column, batch) => {
        if (column === "customer") return `<td>${escapeHtml(batch.customer)}</td>`;
        if (column === "unit") return `<td><strong>${escapeHtml(unitLabel(batch))}</strong></td>`;
        if (column === "network") return usesComms(batch)
          ? `<td>${escapeHtml(NETWORKS[networkOf(batch)].label)} · ${escapeHtml(simLabel(batch.simType))}</td>`
          : "<td>–</td>";
        if (column === "config") {
          const preset = presetFor(batch);
          const swatch = preset?.colourHex ? `<span class="swatch" style="background:${escapeHtml(preset.colourHex)}"></span>` : "";
          return `<td>${swatch}${escapeHtml(preset?.label || batch.configKey || "")}</td>`;
        }
        if (column === "setup") return `<td class="setup-text">${escapeHtml(batch.configText || "")}</td>`;
        if (column === "connector") return `<td>${escapeHtml(batch.connectorKey ? labelOf("connectors", batch.connectorKey) : "–")}</td>`;
        const units = plannedUnits(batch);
        const requested = Number(batch.quantity) || 0;
        return `<td class="units">${units}${units < requested ? ` <small>of ${requested}</small>` : ""}</td>`;
      };
      return `
        <div class="table-scroll">
          <table class="batch-table">
            <thead><tr>${columns.map(column => `<th>${headings[column]}</th>`).join("")}</tr></thead>
            <tbody>${batches.map(batch => `<tr>${columns.map(column => cell(column, batch)).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>`;
    }

    function testingSetupsHtml() {
      const batches = activeBatches().filter(usesComms);
      const standalone = activeBatches().filter(batch => !usesComms(batch));
      const networks = ["verizon", "global"].filter(network => batches.some(batch => networkOf(batch) === network));
      const tasks = state.plan.snapshot?.phases || {};

      // A unit without a network (Solar) tests on its own station.
      const unitCards = [...new Set(standalone.map(unitKeyOf))].map(unit => {
        const station = `testing:${unit}`;
        const rows = standalone.filter(batch => unitKeyOf(batch) === unit);
        const phaseLines = PHASES.map(([phase, label]) => {
          const people = benchPeople(phase).filter(item => item.station === station).map(item => staffName(item.staffKey));
          return people.length ? `<div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(people.join(", "))}</div>` : "";
        }).join("");
        return `
          <div class="setup">
            <h3>${escapeHtml(labelOf("units", unit))} testing</h3>
            <table>
              <thead><tr><th>Customer</th><th>Units</th></tr></thead>
              <tbody>
                ${rows.map(batch => `
                  <tr>
                    <td>${escapeHtml(batch.customer)}</td>
                    <td><strong>${plannedUnits(batch)}</strong>${plannedUnits(batch) < Number(batch.quantity) ? ` of ${Number(batch.quantity)}` : ""}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <div class="phases">${phaseLines || "No testers assigned."}</div>
          </div>`;
      }).join("");

      return unitCards + networks.map(network => {
        const rows = batches.filter(batch => networkOf(batch) === network);
        const sims = [...new Set(rows.map(batch => simLabel(batch.simType)))];
        const job = benchJobs().find(item => item.network === network) || { station: NETWORKS[network].station };
        const phaseLines = PHASES.map(([phase, label]) => {
          const people = benchPeople(phase).filter(item => item.station === job.station).map(item => staffName(item.staffKey));
          if (!people.length) return "";
          const detail = (tasks[phase] || []).find(task => task.station === job.station)?.detail || "";
          return `<div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(people.join(", "))}${detail ? ` — ${escapeHtml(detail)}` : ""}</div>`;
        }).join("");

        return `
          <div class="setup ${NETWORKS[network].cls}">
            <h3>${NETWORKS[network].label} setup</h3>
            <div class="setup-sub">SIM: ${escapeHtml(sims.join(", "))}</div>
            <table>
              <thead><tr><th>Customer</th><th>Unit</th><th>Config</th><th>SIM</th><th>Units</th></tr></thead>
              <tbody>
                ${rows.map(batch => `
                  <tr>
                    <td>${escapeHtml(batch.customer)}</td>
                    <td>${escapeHtml(unitLabel(batch))}</td>
                    <td>${escapeHtml(presetFor(batch)?.label || batch.configKey || "")}</td>
                    <td>${escapeHtml(simLabel(batch.simType))}</td>
                    <td><strong>${plannedUnits(batch)}</strong>${plannedUnits(batch) < Number(batch.quantity) ? ` of ${Number(batch.quantity)}` : ""}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <div class="phases">${phaseLines || "No testers assigned to this setup."}</div>
          </div>`;
      }).join("");
    }

    // ------------------------------------------------------------------
    // Crew-style job board: free people on the left with their skill dots,
    // this bench's jobs as stations on the right.
    // ------------------------------------------------------------------
    const SKILL_KIND = { subAssembly: "assembly", assembly: "assembly", testing: "testing", hardware: "hardware", packing: "packing" };
    const STATION_KIND = {
      subAssembly: "assembly", assembly: "assembly", assemblyGen4: "assembly", assemblyTap: "assembly",
      testing: "testing", testingVerizon: "testing", testingGlobal: "testing",
      hardware: "hardware", packing: "packing", finalPackaging: "final"
    };
    const STATION_ICON = {
      subAssembly: "SA", assembly: "AS", assemblyGen4: "G4", assemblyTap: "TP", testing: "TE",
      testingVerizon: "VZ", testingGlobal: "GL", hardware: "HW", packing: "PB", finalPackaging: "PK"
    };
    const STATION_MIN = { subAssembly: 1, assembly: 1, assemblyGen4: 1, assemblyTap: 1, testing: 1, testingVerizon: 1, testingGlobal: 1, hardware: 3, packing: 1 };
    const KIND_COLOUR = { assembly: "var(--k-assembly)", testing: "var(--k-testing)", hardware: "var(--k-hardware)", packing: "var(--k-packing)", final: "var(--k-cage)" };

    const personName = key => state.staff.get(key)?.name || staffName(key);
    const initials = name => String(name || "?").split(/\s+/).map(part => part[0]).join("").slice(0, 2).toUpperCase();

    function avatarKind(person) {
      let best = null;
      window.PlannerSkills.SKILL_KEYS.forEach(skill => {
        const level = window.PlannerSkills.levelFor(person, skill);
        if (level > 0 && (!best || level > best.level)) best = { level, kind: SKILL_KIND[skill] };
      });
      return best ? best.kind : "none";
    }

    function jobFor(key, phase) {
      return state.assignments.find(item => item.staffKey === key && item.phase === phase) || null;
    }

    function pipsHtml(key) {
      return PHASE_KEYS.map(phase => {
        const job = jobFor(key, phase);
        const colour = job ? KIND_COLOUR[STATION_KIND[job.station] || STATION_KIND[baseOf(job.station)]] || "var(--k-cage)" : "var(--btn)";
        return `<i style="background:${colour}" title="${escapeHtml(phaseLabel(phase))}: ${escapeHtml(job ? job.jobLabel || jobLabel(job.station) : "Free")}"></i>`;
      }).join("");
    }

    function crewCardHtml(key, zone, selectedKey) {
      const person = state.staff.get(key) || { name: key };
      const skills = window.PlannerSkills.SKILL_KEYS.map(skill => {
        const level = window.PlannerSkills.levelFor(person, skill);
        const dots = [1, 2, 3].map(n => `<i class="${level >= n ? "on" : ""}"></i>`).join("");
        return `<span class="crew-skill k-${SKILL_KIND[skill]} ${level ? "" : "none"}">${window.PlannerSkills.SKILL_SHORT[skill]}${level ? dots : ""}</span>`;
      }).join("");
      const status = zone === "off" ? "Free" : jobLabel(zone);
      return `
        <div class="chip crew-card ${selectedKey === key ? "selected" : ""}" data-staff="${escapeHtml(key)}" data-zone="${escapeHtml(zone)}">
          <div class="crew-avatar kind-${avatarKind(person)}">${escapeHtml(initials(person.name || key))}</div>
          <div class="crew-who"><b>${escapeHtml(personName(key))}</b><span>${escapeHtml(status)}</span></div>
          <div class="crew-skills">${skills}</div>
          <div class="crew-pips">${pipsHtml(key)}</div>
        </div>`;
    }

    // Units a job gives this phase (single build only).
    function stationOutput(station, count) {
      if (state.plan.workMode === "mixed") return null;
      const batch = activeBatches()[0];
      if (!batch) return null;
      const inPhase = list => state.assignments.filter(item => item.phase === state.phase && list.includes(item.station)).length;
      if (station === "assembly") return inPhase(["subAssembly"]) > 0 ? count * assemblyPerBench(unitKeyOf(batch), state.phase) : 0;
      if (station === "testing") return testingInBlock(commsKeyOf(batch), state.phase, count);
      if (station === "hardware") return hardwareCapacity(count, unitKeyOf(batch), commsKeyOf(batch), state.phase);
      if (station === "packing") return packingCapacity(count, unitKeyOf(batch), state.phase);
      return null;
    }

    function stationHtml(job, tasks, selectedKey) {
      const people = benchPeople(state.phase).filter(item => item.station === job.station).map(item => item.staffKey);
      const kind = STATION_KIND[job.station] || STATION_KIND[baseOf(job.station)] || "final";
      const least = STATION_MIN[job.station] ?? (productOf(job.station) ? 1 : STATION_MIN[baseOf(job.station)] || 0);
      const needed = Math.max(0, least - people.length);
      const output = stationOutput(job.station, people.length);
      const detail = tasks.find(task => task.station === job.station)?.detail || "";
      const status = needed > 0 && people.length > 0
        ? `<div class="crew-state short">Needs ${needed} more</div>`
        : people.length
          ? `<div class="crew-state ok">Running${output !== null ? ` · ${output} units` : ""}</div>`
          : '<div class="crew-state">Idle</div>';
      return `
        <div class="zone crew-station ${NETWORKS[job.network]?.cls || ""}" data-zone="${escapeHtml(job.station)}" data-station="${escapeHtml(job.station)}">
          <div class="crew-station-head">
            <span class="crew-icon kind-${kind}">${escapeHtml(STATION_ICON[job.station] || STATION_ICON[baseOf(job.station)] || "··")}</span>
            <b>${escapeHtml(job.label)}</b>
            <span class="cant">Can't</span>
          </div>
          ${status}
          ${detail ? `<div class="crew-detail-line">${escapeHtml(detail)}</div>` : ""}
          <div class="crew-slots">
            ${people.map(key => crewCardHtml(key, job.station, selectedKey)).join("")}
            <div class="crew-drop" aria-label="Empty slot"></div>
          </div>
        </div>`;
    }

    function detailHtml(key) {
      const person = key ? state.staff.get(key) : null;
      if (!person) return "";
      const skills = window.PlannerSkills.SKILL_KEYS.map(skill => {
        const level = window.PlannerSkills.levelFor(person, skill);
        return `<div><span>${escapeHtml(window.PlannerSkills.SKILL_LABELS[skill])}</span><span class="crew-dots">${level ? [1, 2, 3].map(n => `<i class="${level >= n ? "on" : ""}"></i>`).join("") : "Can't"}</span></div>`;
      }).join("");
      const today = PHASES.map(([phase, label]) => {
        const job = jobFor(key, phase);
        return `<div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(job ? job.jobLabel || jobLabel(job.station) : "Free")}</div>`;
      }).join("");
      return `
        <div class="crew-detail">
          <div class="crew-detail-head"><div class="crew-avatar kind-${avatarKind(person)}">${escapeHtml(initials(person.name || key))}</div><b>${escapeHtml(personName(key))}</b></div>
          <div class="crew-detail-skills">${skills}</div>
          <div class="crew-today">${today}</div>
        </div>`;
    }

    // While someone is held or selected, light up where they'd do well.
    function highlightFit(key) {
      const person = key ? state.staff.get(key) : null;
      document.querySelectorAll("#board .crew-station[data-station]").forEach(element => {
        element.classList.remove("fit-0", "fit-2", "fit-3");
        if (!person) return;
        const level = window.PlannerSkills.levelFor(person, element.dataset.station);
        element.classList.add(level >= 3 ? "fit-3" : level >= 1 ? "fit-2" : "fit-0");
      });
    }

    function renderBoard() {
      $("boardCard").classList.toggle("hidden", !hasBoard);
      if (!hasBoard) return;

      $("boardTitle").textContent = `Who's on ${bench.label}`;
      $("phaseTabs").innerHTML = PHASES.map(([phase, label]) => {
        const count = benchPeople(phase).length;
        return `<button type="button" role="tab" data-phase="${phase}" class="${phase === state.phase ? "active" : ""}" aria-selected="${phase === state.phase}">${label} (${count})</button>`;
      }).join("");

      const tasks = state.plan.snapshot?.phases?.[state.phase] || [];
      const selectedKey = board?.selected?.staffKey || null;
      const free = availablePeople(state.phase);

      $("board").innerHTML = `
        <div class="crew-layout">
          <section class="crew-panel">
            <div class="crew-panel-head"><h3>Not on ${escapeHtml(bench.label)}</h3><span>${free.length} free</span></div>
            <div class="zone crew-roster" data-zone="off">${free.map(key => crewCardHtml(key, "off", selectedKey)).join("")}</div>
            ${detailHtml(selectedKey)}
          </section>
          <section class="crew-panel">
            <div class="crew-panel-head"><h3>Jobs</h3></div>
            <div class="crew-stations">${benchJobs().map(job => stationHtml(job, tasks, selectedKey)).join("")}</div>
          </section>
        </div>`;
      highlightFit(selectedKey);
    }

    function renderEvents() {
      const items = state.events.map(event => {
        const date = event.createdAt?.toDate ? event.createdAt.toDate() : null;
        const time = date ? date.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" }) : "now";
        return `<li><span class="time">${escapeHtml(time)}</span>${escapeHtml(event.message || "")}<span class="who">${escapeHtml(event.createdBy || "")}</span></li>`;
      });
      $("events").innerHTML = items.join("") || '<li class="empty">No changes yet.</li>';
    }

    // ------------------------------------------------------------------
    // Moving people
    // ------------------------------------------------------------------
    function toast(message, isError = false) {
      document.querySelector(".toast")?.remove();
      const element = document.createElement("div");
      element.className = `toast ${isError ? "error" : ""}`;
      element.textContent = message;
      document.body.appendChild(element);
      setTimeout(() => element.remove(), 4000);
    }

    function askReason(name) {
      return new Promise(resolve => {
        const backdrop = document.createElement("div");
        backdrop.className = "dialog-backdrop";
        backdrop.innerHTML = `
          <div class="dialog" role="dialog" aria-modal="true">
            <h3></h3>
            <p>Management will see this straight away.</p>
            <div class="choices">
              <button type="button" data-reason="${SICK_REASON}">Sick · rest of the day</button>
              <button type="button" data-reason="Busy">Busy · this block</button>
              <button type="button" data-reason="Moved to another bench">Moved to another bench</button>
              <input type="text" placeholder="Other reason" maxlength="120" />
              <button type="button" data-reason="other">Use other reason</button>
              <button type="button" class="secondary" data-reason="">Cancel</button>
            </div>
          </div>`;
        backdrop.querySelector("h3").textContent = `Why is ${name} coming off ${bench.label} (${phaseLabel(state.phase)})?`;
        document.body.appendChild(backdrop);
        backdrop.addEventListener("click", event => {
          const button = event.target.closest("button[data-reason]");
          if (!button) return;
          let reason = button.dataset.reason;
          if (reason === "other") {
            reason = backdrop.querySelector("input").value.trim();
            if (!reason) {
              backdrop.querySelector("input").focus();
              return;
            }
          }
          backdrop.remove();
          resolve(reason || null);
        });
      });
    }

    function assignmentRef(phase, staffKey) {
      return doc(db, "plans", state.date, "assignments", `${phase}_${staffKey}`);
    }

    function logEvent(fields) {
      return addDoc(collection(db, "plans", state.date, "events"), {
        bench: benchKey,
        createdBy: ACTOR,
        createdAt: serverTimestamp(),
        ...fields
      });
    }

    async function applyMove(staffKey, from, to) {
      if (!state.plan || from === to || state.busy) return;
      const phase = state.phase;
      const name = staffName(staffKey);
      const phaseName = phaseLabel(phase).toLowerCase();

      if (to !== "off" && !canDo(state.staff.get(staffKey), to)) {
        toast(`${name} can't do ${jobLabel(to)}.`, true);
        render();
        return;
      }

      let next = state.assignments.filter(item => !(item.phase === phase && item.staffKey === staffKey));
      let reason = null;
      let laterPhases = [];
      if (to === "off") {
        reason = await askReason(name);
        if (!reason) return;
        // Someone who has gone home comes off every job for the rest of the day.
        if (reason === SICK_REASON) {
          const later = PHASE_KEYS.slice(PHASE_KEYS.indexOf(phase) + 1);
          laterPhases = state.assignments.filter(item => item.staffKey === staffKey && later.includes(item.phase));
          next = next.filter(item => !(item.staffKey === staffKey && later.includes(item.phase)));
        }
      } else {
        next = [...next, { phase, station: to, staffKey }];
      }

      state.busy = true;
      render();
      try {
        if (to === "off") {
          await deleteDoc(assignmentRef(phase, staffKey));
          for (const item of laterPhases) await deleteDoc(assignmentRef(item.phase, staffKey));
          const rest = laterPhases.length ? " Also taken off the rest of the day." : "";
          await logEvent({ kind: "removed", staffKey, message: `${name} taken off ${jobLabel(from)} (${phaseName}): ${reason}.${rest}` });
        } else {
          await setDoc(assignmentRef(phase, staffKey), {
            phase,
            station: to,
            jobLabel: jobLabel(to),
            staffKey,
            source: "bench",
            updatedBy: ACTOR,
            updatedAt: serverTimestamp()
          });
          await logEvent(from === "off"
            ? { kind: "added", staffKey, message: `${name} added to ${jobLabel(to)} (${phaseName}).` }
            : { kind: "moved", staffKey, message: `${name} moved from ${jobLabel(from)} to ${jobLabel(to)} (${phaseName}).` });
        }
        await updateTarget(next);
      } catch (error) {
        toast(`That change wasn't saved: ${friendlyError(error)}`, true);
      } finally {
        state.busy = false;
        render();
      }
    }

    // Recalculate the bench limits; the day target is the lowest of the
    // planned target and every bench's limit. All benches are checked, because
    // sending someone home also takes them off later jobs on other benches.
    const LIMIT_BENCHES = ["assembly", "testing", "hardware", "packing"];

    async function updateTarget(nextAssignments) {
      const plan = state.plan;
      const planned = plan.plannedTarget ?? 0;
      const before = plan.currentTarget ?? planned;
      const limits = { ...(plan.benchLimits || {}) };
      const changes = {};
      LIMIT_BENCHES.forEach(key => {
        const now = benchLimit(key, plan, nextAssignments);
        if (now === null) return;
        const stored = plan.benchLimits?.[key];
        if (stored === undefined && now >= planned) return;   // not limiting the day
        limits[key] = now;
        if (stored !== now) changes[`benchLimits.${key}`] = now;
      });
      const after = Math.max(0, Math.min(planned, ...Object.values(limits).map(Number)));

      if (after === before && !Object.keys(changes).length) return;

      await updateDoc(doc(db, "plans", state.date), {
        currentTarget: after,
        ...changes,
        updatedAt: serverTimestamp(),
        updatedBy: ACTOR
      });

      if (after !== before) {
        await logEvent({
          kind: "target_changed",
          message: `Day target changed from ${before} to ${after} after ${bench.label} changes.`,
          targetBefore: before,
          targetAfter: after
        });
        toast(`Day target is now ${after} (was ${before}). Management has been told.`);
      }
    }

    function wireBoard() {
      board = window.attachDragBoard($("board"), {
        onMove: applyMove,
        onSelect: () => render(),
        onDragStart: key => highlightFit(key),
        onDragEnd: () => {
          if (renderPending) render();
          else highlightFit(board.selected?.staffKey || null);
        },
        isBusy: () => state.busy || !state.plan
      });

      $("phaseTabs").addEventListener("click", event => {
        const button = event.target.closest("button[data-phase]");
        if (!button) return;
        state.phase = button.dataset.phase;
        board.clearSelection();
      });
    }

    // ------------------------------------------------------------------
    // Start
    // ------------------------------------------------------------------
    function shiftDate(days) {
      const date = fromInputDate(state.date || toInputDate(new Date()));
      date.setDate(date.getDate() + days);
      openDate(toInputDate(date));
    }

    // iPad home-screen icon and name for this bench.
    function setHomeScreenDetails() {
      if (benchKey) document.body.dataset.bench = benchKey;
      const name = bench ? bench.label : "Bench screens";
      document.title = bench ? `${bench.label} · Production Planner` : "Bench screens · Production Planner";
      document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", name);
      document.querySelector('link[rel="apple-touch-icon"]')?.setAttribute("href", `icons/${benchKey || "bench"}.png`);
    }

    function showChooser() {
      $("topActions").classList.add("hidden");
      $("benchTitle").textContent = "Bench screens";
      $("dateLabel").textContent = "–";
      $("chooserLinks").innerHTML = Object.entries(BENCHES)
        .map(([key, item]) => `<a href="bench.html?bench=${key}">${escapeHtml(item.label)}</a>`)
        .join("");
      $("chooser").classList.remove("hidden");
    }

    async function start() {
      setHomeScreenDetails();
      if (!bench) {
        showChooser();
        return;
      }

      state.role = await ensureAccess({
        title: bench.label,
        pinLabel: "Bench PIN",
        allowed: ["bench", "management"],
        wrongRoleMessage: "That PIN isn't right."
      });
      watchLists(() => render());

      try {
        await loadReference();
      } catch (error) {
        toast(friendlyError(error), true);
      }

      wireBoard();
      $("prevDay").addEventListener("click", () => shiftDate(-1));
      $("nextDay").addEventListener("click", () => shiftDate(1));
      $("todayButton").addEventListener("click", () => openDate(toInputDate(new Date())));
      $("dateInput").addEventListener("change", event => {
        if (event.target.value) openDate(event.target.value);
      });
      $("planArea").addEventListener("click", event => {
        const action = event.target.closest("button[data-action]");
        if (action) return makeBenchRequest(action.dataset.action);
        const move = event.target.closest("button[data-req-move]");
        if (move) return moveBenchRequest(move.dataset.reqMove, move.dataset.reqTo);
        const setButton = event.target.closest("button[data-set]");
        if (setButton) return setStatus(setButton.dataset.batch, setButton.dataset.set);
        const photo = event.target.closest("[data-photo]");
        if (photo) return showPhoto(photo.getAttribute("src"));
        const edit = event.target.closest("[data-edit-note]");
        if (edit) return changeNote(edit.dataset.editNote);
        const remove = event.target.closest("[data-remove-note]");
        if (remove) return deleteNote(remove.dataset.removeNote);
      });
      $("pinNoteButton").addEventListener("click", pinNote);
      $("blockTabs").addEventListener("click", event => {
        const button = event.target.closest("button[data-block]");
        if (!button) return;
        state.phase = button.dataset.block;
        state.followClock = isToday() && state.phase === currentBlock();
        board?.clearSelection();
        render();
      });
      $("teamPanel").addEventListener("change", event => {
        const off = event.target.closest("input[data-team-off]");
        if (off) {
          off.checked = true;   // stays ticked unless the move goes through
          return applyMove(off.dataset.teamOff, off.dataset.station, "off");
        }
        const on = event.target.closest("input[data-team-on]");
        if (on) {
          on.checked = false;
          return applyMove(on.dataset.teamOn, "off", on.dataset.station);
        }
      });
      $("noteButton").addEventListener("click", writeMessage);
      $("guideCards").addEventListener("click", event => {
        const card = event.target.closest("[data-guide]");
        if (card) openGuide(card.dataset.guide);
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") document.querySelector(".guide-view")?.remove();
      });
      onSnapshot(collection(db, "guides"), snapshot => {
        state.guides = snapshot.docs.map(entry => ({ id: entry.id, ...entry.data() }));
        if (state.plan) renderGuides();
      }, () => {});
      $("messageList").addEventListener("click", event => {
        const button = event.target.closest("[data-message-seen]");
        if (button) {
          button.disabled = true;
          seenMessage(button.dataset.messageSeen);
        }
      });
      $("moreButton").addEventListener("click", () => {
        $("moreTitle").textContent = `${bench.label} · ${phaseLabel(state.phase)}`;
        $("moreSheet").classList.remove("hidden");
      });
      $("moreClose").addEventListener("click", () => $("moreSheet").classList.add("hidden"));
      // Move on to the next block when it starts (unless another was picked).
      setInterval(() => {
        if (!state.followClock || !isToday() || state.busy || board?.isDragging()) return;
        const block = currentBlock();
        if (block !== state.phase) {
          state.phase = block;
          render();
        }
      }, 60000);
      if (JOB_STAGES.includes(benchKey)) {
        onSnapshot(query(collection(db, "jobs"), where("stage", "==", benchKey)), snapshot => {
          state.waitingJobs = snapshot.docs
            .map(entry => ({ id: entry.id, ...entry.data() }))
            .sort((a, b) => String(a.day).localeCompare(String(b.day)) || a.id.localeCompare(b.id));
          if (state.plan) renderBatchStatuses();
        }, () => {});
      }
      $("nextPlan").addEventListener("click", event => {
        const button = event.target.closest("button[data-open-date]");
        if (button) openDate(button.dataset.openDate);
      });
      $("lockButton").addEventListener("click", async () => {
        await lockScreen();
        window.location.reload();
      });

      const requested = new URLSearchParams(window.location.search).get("date");
      openDate(/^\d{4}-\d{2}-\d{2}$/.test(requested || "") ? requested : toInputDate(new Date()));
    }

    start();
  </script>
</body>
</html>
