<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Planner (test) · Production Planner</title>
  <link rel="icon" type="image/png" href="icons/planner.png" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1e293b;
      --paper: #ffffff;
      --floor: #dfe7f1;
      --floor-line: #cfd9e6;
      --muted: #64748b;
      --good: #16a34a;
      --warn: #f59e0b;
      --bad: #ef4444;
      --k-assembly: #f59e0b;
      --k-testing: #3b82f6;
      --k-hardware: #8b5cf6;
      --k-packing: #10b981;
      --k-final: #94a3b8;
      --k-break: #f472b6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        linear-gradient(var(--floor-line) 2px, transparent 2px) 0 0 / 48px 48px,
        linear-gradient(90deg, var(--floor-line) 2px, transparent 2px) 0 0 / 48px 48px,
        var(--floor);
      overscroll-behavior: none;
    }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    /* HUD ------------------------------------------------------------ */
    .hud {
      position: sticky; top: 0; z-index: 20;
      display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px;
      padding: 10px 16px; background: #1e293b; color: #fff;
      box-shadow: 0 4px 0 rgba(30, 41, 59, 0.25);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; white-space: nowrap; }
    .brand-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fbbf24; color: #422006; letter-spacing: 0.05em; }
    .phase-tabs { justify-self: center; display: inline-flex; background: #0f172a; border-radius: 14px; padding: 4px; gap: 4px; }
    .phase-tabs button { border: none; border-radius: 10px; padding: 8px 16px; background: transparent; color: #94a3b8; font-weight: 600; font-size: 16px; }
    .phase-tabs button.active { background: #fbbf24; color: #422006; box-shadow: 0 3px 0 #b45309; }
    .score { display: flex; align-items: center; gap: 12px; background: #0f172a; border-radius: 14px; padding: 6px 14px; }
    .score-num { font-size: 34px; font-weight: 700; line-height: 1; min-width: 46px; text-align: right; }
    .score-par { font-size: 15px; color: #94a3b8; font-weight: 600; }
    .stars { display: flex; gap: 2px; }
    .stars svg { width: 26px; height: 26px; }
    .stars .star { fill: #334155; stroke: #0b1220; stroke-width: 1.5; transition: fill 0.25s; }
    .stars .star.on { fill: #fbbf24; }
    .stars .pop { animation: starPop 0.5s ease; transform-origin: center; transform-box: fill-box; }
    @keyframes starPop { 0% { transform: scale(0.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .limited { font-size: 12px; color: #fca5a5; font-weight: 600; min-height: 15px; }
    .tools { display: flex; align-items: center; gap: 8px; }
    .tools input[type="date"] { font: inherit; font-size: 15px; padding: 7px 10px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #fff; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; }
    .icon-btn svg { width: 20px; height: 20px; }

    /* Floor ---------------------------------------------------------- */
    main { padding: 18px; display: grid; grid-template-columns: minmax(250px, 0.8fr) minmax(0, 2.2fr); gap: 18px; align-items: start; }
    .stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
    /* Worker card ---------------------------------------------------- */
    .card { position: fixed; z-index: 30; left: 18px; bottom: 18px; width: 300px; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 rgba(30, 41, 59, 0.25); padding: 12px 14px; }
    .card-top { display: flex; align-items: center; gap: 10px; }
    .card-top .ch { width: 66px; cursor: default; }
    .card-top .ch svg { width: 66px; height: 102px; }
    .card-top .ch-name { display: none; }
    .card h3 { margin: 0; font-size: 22px; }
    .card p { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
    .card-skills { display: grid; gap: 5px; margin-top: 8px; }
    .card-skill { display: flex; align-items: center; justify-content: space-between; font-weight: 600; padding: 3px 8px; border-radius: 10px; background: #f1f5f9; }
    .dots { display: inline-flex; gap: 4px; }
    .dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
    .dots i.on { background: #fbbf24; }
    .card-skill.none { color: #94a3b8; }

    /* Effects -------------------------------------------------------- */
    .toast { position: fixed; z-index: 120; pointer-events: none; padding: 4px 12px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; font-weight: 700; animation: toast 1.4s ease forwards; }
    @keyframes toast { 0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, -10px) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -30px); opacity: 0; } }
    .confetti { position: fixed; z-index: 110; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; animation: confetti 1.6s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
    @keyframes confetti { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
    .notice { padding: 40px; text-align: center; font-size: 20px; font-weight: 600; color: var(--muted); }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .hud { grid-template-columns: 1fr auto; }
      .phase-tabs { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ch-inner, .active .spark, .active .screen, .w-assembly .arm-r, .w-subAssembly .arm-r, .w-hardware .arm-r, .w-packing .ch-inner, .w-final .arm-r, .w-testing .head { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="hud">
    <div class="brand">Shift Planner <span class="brand-tag">TEST</span></div>
    <div class="phase-tabs" id="phaseTabs" role="tablist">
      <button type="button" data-phase="start" class="active">Start</button>
      <button type="button" data-phase="second">Second</button>
      <button type="button" data-phase="finish">Finish</button>
    </div>
    <div class="score" aria-live="polite">
      <div>
        <div style="display:flex;align-items:baseline;gap:6px"><span class="score-num" id="scoreNow">0</span><span class="score-par">/ <span id="scorePar">–</span></span></div>
        <div class="limited" id="limitedBy"></div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
    <div class="tools">
      <input type="date" id="dateInput" aria-label="Day" />
      <button type="button" class="icon-btn" id="muteBtn" aria-label="Sound"></button>
      <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset to plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <div class="notice" id="notice">Loading…</div>
  <main id="floor" hidden>
    <section class="room r-break break zone" data-zone="free" id="breakRoom"></section>
    <section class="stations" id="stations"></section>
  </main>
  <aside class="card" id="card" hidden></aside>

  <script src="js/skills.js"></script>
  <script type="module">
    import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db, ensureAccess, friendlyError } from "./js/session.js";
    import { dailyLimit, phaseOutput, dayEstimate } from "./js/capacity.js";
    import { characterSvg, decorSvg } from "./js/characters.js";

    const PHASES = ["start", "second", "finish"];
    const SKILL = window.PlannerSkills;

    const STATIONS = {
      subAssembly:    { label: "Sub Assembly", kind: "assembly", work: "subAssembly", icon: "SA", min: 1 },
      assembly:       { label: "Assembly", kind: "assembly", work: "assembly", icon: "AS", min: 1 },
      assemblyGen4:   { label: "Gen4 Assembly", kind: "assembly", work: "assembly", icon: "G4", min: 1 },
      assemblyTap:    { label: "Tap Assembly", kind: "assembly", work: "assembly", icon: "TP", min: 1 },
      testing:        { label: "Testing", kind: "testing", work: "testing", icon: "TE", min: 2 },
      testingVerizon: { label: "Verizon Testing", kind: "testing", work: "testing", icon: "VZ", min: 1 },
      testingGlobal:  { label: "Global Testing", kind: "testing", work: "testing", icon: "GL", min: 1 },
      hardware:       { label: "Hardware Check", kind: "hardware", work: "hardware", icon: "HW", min: 2 },
      packing:        { label: "Packing", kind: "packing", work: "packing", icon: "PK", min: 2 },
      finalPackaging: { label: "Final Packaging", kind: "final", work: "final", icon: "FP", min: 0 }
    };
    const STAGE_LABEL = { assembly: "Assembly", testing: "Testing", hardware: "Hardware", packing: "Packing" };
    const STAGE_OF = { assembly: "assembly", testing: "testing", hardware: "hardware", packing: "packing" };

    const $ = id => document.getElementById(id);
    const state = { date: "", plan: null, staff: new Map(), away: new Set(), phase: "start", start: null, layout: null, selected: null, stars: 0, shown: 0 };

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    // ------------------------------------------------------------------
    // Sound: tiny blips made on the fly (no files).
    // ------------------------------------------------------------------
    let audio = null;
    let muted = false;
    try { muted = localStorage.getItem("shiftPlannerMuted") === "1"; } catch { /* default on */ }
    function tone(from, to, duration, type = "sine", volume = 0.07, delay = 0) {
      if (muted) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const start = audio.currentTime + delay;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(from, start);
        osc.frequency.exponentialRampToValueAtTime(to, start + duration);
        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      } catch { /* no sound available */ }
    }
    const sfx = {
      pick: () => tone(380, 820, 0.12, "triangle"),
      drop: () => { tone(260, 130, 0.09, "square", 0.04); tone(600, 900, 0.07, "triangle", 0.05, 0.05); },
      nope: () => tone(160, 110, 0.22, "sawtooth", 0.04),
      star: () => [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.18, "triangle", 0.06, i * 0.09)),
      select: () => tone(700, 900, 0.06, "sine", 0.04)
    };
    function drawMute() {
      $("muteBtn").innerHTML = muted
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    }

    function firstName(key) {
      const person = state.staff.get(key);
      return person?.firstName || String(person?.name || key).split(/\s+/)[0];
    }

    function characterHtml(key, zone, index) {
      const station = zone === "free" ? null : zone;
      const work = station ? STATIONS[station]?.work : null;
      const classes = ["ch", station ? `working w-${work}` : "", state.selected === key ? "selected" : ""].join(" ");
      return `
        <div class="${classes}" data-key="${escapeHtml(key)}" data-zone="${escapeHtml(zone)}" style="--d:${(index % 7) * -0.37}s" role="button" tabindex="0" aria-label="${escapeHtml(firstName(key))}">
          <div class="ch-inner">${characterSvg(key, work)}</div>
          <div class="ch-name">${escapeHtml(firstName(key))}</div>
        </div>`;
    }

    // ------------------------------------------------------------------
    // Loading the day (the same data as the rest of the app)
    // ------------------------------------------------------------------
    function batches() {
      return (state.plan?.batches || []).filter(batch => Number(batch.quantity) > 0);
    }
    const isSingle = () => state.plan?.workMode !== "mixed";
    function stationList() {
      if (isSingle()) return ["subAssembly", "assembly", "testing", "hardware", "packing", "finalPackaging"];
      const list = ["subAssembly"];
      if (batches().some(batch => batch.unitType !== "tap")) list.push("assemblyGen4");
      if (batches().some(batch => batch.unitType === "tap")) list.push("assemblyTap");
      if (batches().some(batch => batch.commsType === "verizon")) list.push("testingVerizon");
      if (batches().some(batch => batch.commsType !== "verizon")) list.push("testingGlobal");
      return [...list, "hardware", "packing", "finalPackaging"];
    }

    async function openDate(date) {
      state.date = date;
      $("dateInput").value = date;
      $("notice").hidden = false;
      $("notice").textContent = "Loading…";
      $("floor").hidden = true;
      select(null);

      let plan = null;
      try {
        const snapshot = await getDoc(doc(db, "plans", date));
        plan = snapshot.exists() ? snapshot.data() : null;
      } catch { plan = null; }
      if (!plan) plan = { status: "none", workMode: "single", plannedTarget: null, batches: [{ unitType: "gen4", commsType: "verizon", quantity: 1 }] };

      let assignments = null;
      if (plan.status === "released") {
        try {
          assignments = (await getDocs(collection(db, "plans", date, "assignments"))).docs.map(entry => entry.data());
        } catch { assignments = null; }
      }
      try {
        const roster = await getDoc(doc(db, "rosters", date));
        const entries = roster.exists() ? roster.data().entries || {} : {};
        state.away = new Set(Object.entries(entries).filter(([, entry]) => entry?.available === false).map(([key]) => key));
      } catch { state.away = new Set(); }
      if (state.date !== date) return;

      const start = Object.fromEntries(PHASES.map(phase => [phase, new Map()]));
      if (assignments) assignments.forEach(item => start[item.phase]?.set(item.staffKey, item.station));
      else PHASES.forEach(phase => (plan.snapshot?.phases?.[phase] || []).forEach(task => (task.workers || []).forEach(key => start[phase].set(key, task.station))));
      // Only people who are in, and only jobs this screen has.
      PHASES.forEach(phase => start[phase].forEach((station, key) => {
        if (state.away.has(key) || !STATIONS[station]) start[phase].delete(key);
      }));

      state.plan = plan;
      state.start = start;
      state.layout = Object.fromEntries(PHASES.map(phase => [phase, new Map(start[phase])]));
      $("notice").hidden = true;
      $("floor").hidden = false;
      render();
    }

    // ------------------------------------------------------------------
    // Score
    // ------------------------------------------------------------------
    function counts(phase) {
      const result = {};
      state.layout[phase].forEach(station => {
        const key = station.startsWith("assembly") ? (isSingle() ? station : "assembly") : station;
        result[key] = (result[key] || 0) + 1;
      });
      return result;
    }
    const batch0 = () => batches()[0] || { unitType: "gen4", commsType: "verizon" };
    function par() {
      return state.plan?.plannedTarget ?? state.plan?.snapshot?.capacity?.realistic ?? dailyLimit(batch0().commsType);
    }
    function estimate() {
      if (!isSingle()) return null;
      return dayEstimate(PHASES.map(counts), batch0().unitType, batch0().commsType);
    }
    function starCount(units, target) {
      if (!target) return 0;
      const ratio = units / target;
      return ratio >= 1 ? 3 : ratio >= 0.85 ? 2 : ratio >= 0.6 ? 1 : 0;
    }
    const STAR_PATH = "M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z";

    function renderScore() {
      const est = estimate();
      const target = par();
      const units = est ? est.units : null;
      $("scorePar").textContent = target ?? "–";
      $("limitedBy").textContent = est && units < target ? `Limited by ${STAGE_LABEL[est.limitedBy]}` : "";
      const stars = units === null ? 0 : starCount(units, target);
      $("stars").innerHTML = [0, 1, 2].map(i => `<svg viewBox="0 0 24 24"><path class="star ${i < stars ? "on" : ""} ${i < stars && i >= state.stars ? "pop" : ""}" d="${STAR_PATH}"/></svg>`).join("");
      if (stars === 3 && state.stars < 3) celebrate();
      state.stars = stars;
      rollNumber(units);
    }

    let rollTimer = null;
    function rollNumber(to) {
      clearInterval(rollTimer);
      if (to === null) { $("scoreNow").textContent = "—"; return; }
      const from = state.shown;
      if (from === to) { $("scoreNow").textContent = to; return; }
      const steps = 12;
      let i = 0;
      rollTimer = setInterval(() => {
        i++;
        state.shown = Math.round(from + (to - from) * (i / steps));
        $("scoreNow").textContent = state.shown;
        if (i >= steps) { clearInterval(rollTimer); state.shown = to; }
      }, 28);
    }

    function celebrate() {
      sfx.star();
      const colours = ["#fbbf24", "#f472b6", "#60a5fa", "#34d399", "#f97316", "#a78bfa"];
      const origin = $("stars").getBoundingClientRect();
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = `${origin.left + origin.width / 2}px`;
        piece.style.top = `${origin.bottom}px`;
        piece.style.background = colours[i % colours.length];
        piece.style.setProperty("--x", `${(Math.random() - 0.5) * 520}px`);
        piece.style.setProperty("--y", `${120 + Math.random() * 380}px`);
        piece.style.setProperty("--r", `${(Math.random() - 0.5) * 900}deg`);
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1700);
      }
    }

    // ------------------------------------------------------------------
    // Rendering the floor
    // ------------------------------------------------------------------
    function inProductionKeys() {
      return [...state.staff.entries()]
        .filter(([key, person]) => SKILL.inProduction(person) && !state.away.has(key))
        .map(([key]) => key)
        .sort((a, b) => firstName(a).localeCompare(firstName(b)));
    }

    function roomBadge(station, n, est) {
      const info = STATIONS[station];
      if (!n) return { text: "", cls: "" };
      if (n < info.min) return { text: `Need ${info.min - n}`, cls: "warn" };
      const stage = STAGE_OF[station.startsWith("assembly") ? "assembly" : station.startsWith("testing") ? "testing" : station];
      if (est && stage && est.limitedBy === stage && est.units < par()) return { text: "Slowest", cls: "warn" };
      return { text: "✓", cls: "good" };
    }

    function render() {
      if (drag) { pendingRender = true; return; }
      pendingRender = false;
      document.querySelectorAll("#phaseTabs button").forEach(button => button.classList.toggle("active", button.dataset.phase === state.phase));

      const layout = state.layout[state.phase];
      const people = inProductionKeys();
      const free = people.filter(key => !layout.has(key));
      const est = estimate();
      const phaseCounts = counts(state.phase);

      $("breakRoom").innerHTML = `
        <div class="room-head"><span class="room-icon">BR</span><b>Break Room</b><span class="room-badge">${free.length}</span></div>
        <div class="room-scene">${decorSvg("break", 0)}<div class="room-crew">${free.map((key, i) => characterHtml(key, "free", i)).join("")}</div></div>`;

      $("stations").innerHTML = stationList().map(station => {
        const info = STATIONS[station];
        const crew = people.filter(key => layout.get(key) === station);
        const badge = roomBadge(station, crew.length, est);
        const countKey = station.startsWith("assembly") && !isSingle() ? "assembly" : station;
        const output = isSingle() ? phaseOutput(countKey, phaseCounts, batch0().unitType, batch0().commsType) : null;
        return `
          <section class="room zone r-${info.kind} ${crew.length ? "active" : ""}" data-zone="${station}" data-station="${station}">
            <div class="room-head"><span class="room-icon">${info.icon}</span><b>${escapeHtml(info.label)}</b><span class="room-badge ${badge.cls}">${badge.text}</span></div>
            <div class="room-scene">${decorSvg(info.kind, crew.length)}<div class="room-crew">${crew.map((key, i) => characterHtml(key, station, i)).join("")}</div><div class="cant">Can't</div></div>
            <div class="room-foot"><span class="room-out">${output === null ? "&nbsp;" : `${output}<small>units</small>`}</span><span class="room-count">${crew.length}</span></div>
          </section>`;
      }).join("");

      renderScore();
      renderCard();
      highlight(state.selected);
    }

    function renderCard() {
      const key = state.selected;
      const person = key ? state.staff.get(key) : null;
      $("card").hidden = !person;
      if (!person) return;
      const station = state.layout[state.phase].get(key);
      $("card").innerHTML = `
        <div class="card-top">
          <div class="ch"><div class="ch-inner">${characterSvg(key, null)}</div></div>
          <div><h3>${escapeHtml(person.name || firstName(key))}</h3><p>${escapeHtml(station ? STATIONS[station]?.label || station : "Break Room")}</p></div>
        </div>
        <div class="card-skills">${SKILL.SKILL_KEYS.map(skill => {
          const level = SKILL.levelFor(person, skill);
          return `<div class="card-skill ${level ? "" : "none"}"><span>${escapeHtml(SKILL.SKILL_LABELS[skill])}</span>${level ? `<span class="dots">${[1, 2, 3].map(n => `<i class="${level >= n ? "on" : ""}"></i>`).join("")}</span>` : "<span>✕</span>"}</div>`;
        }).join("")}</div>`;
    }

    // Light up the benches someone would be good at.
    function highlight(key) {
      const person = key ? state.staff.get(key) : null;
      document.querySelectorAll(".room[data-station]").forEach(room => {
        room.classList.remove("fit-0", "fit-2", "fit-3");
        room.classList.toggle("selecting", Boolean(person));
        if (!person) return;
        const level = SKILL.levelFor(person, room.dataset.station);
        room.classList.add(level >= 3 ? "fit-3" : level >= 1 ? "fit-2" : "fit-0");
      });
    }

    function popToast(text, x, y) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = text;
      toast.style.left = `${x}px`;
      toast.style.top = `${y}px`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1400);
    }

    // ------------------------------------------------------------------
    // Moving people (in this test only; nothing is saved)
    // ------------------------------------------------------------------
    function place(key, zone, x, y) {
      const person = state.staff.get(key);
      if (zone !== "free" && SKILL.levelFor(person, zone) === 0) {
        sfx.nope();
        popToast(`Can't do ${STATIONS[zone].label}`, x, y);
        render();
        document.querySelector(`.ch[data-key="${CSS.escape(key)}"]`)?.classList.add("nope");
        return false;
      }
      if (zone === "free") state.layout[state.phase].delete(key);
      else state.layout[state.phase].set(key, zone);
      sfx.drop();
      render();
      const landed = document.querySelector(`.ch[data-key="${CSS.escape(key)}"]`);
      landed?.classList.add("landing");
      return true;
    }

    function select(key) {
      state.selected = key;
      renderCard();
      document.querySelectorAll(".ch[data-key]").forEach(element => element.classList.toggle("selected", element.dataset.key === key));
      highlight(key);
    }

    // Pick up: the worker hangs from the pointer and swings with the
    // movement, arms and legs flailing. A short tap selects instead.
    let drag = null;
    let pendingRender = false;

    function startDrag(event, element) {
      const key = element.dataset.key;
      const rect = element.getBoundingClientRect();
      drag = {
        key, from: element.dataset.zone, element, pointerId: event.pointerId,
        startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY,
        lastX: event.clientX, lastT: performance.now(), vx: 0,
        angle: 0, spin: 0, width: rect.width, wrap: null, frame: 0, lifted: false
      };
    }

    function lift() {
      drag.lifted = true;
      drag.element.classList.add("lifting");
      const wrap = document.createElement("div");
      wrap.className = "held-wrap";
      wrap.innerHTML = `<div class="ch held">${characterSvg(drag.key, null)}</div>`;
      document.body.appendChild(wrap);
      drag.wrap = wrap;
      sfx.pick();
      highlight(drag.key);
      const tick = () => {
        if (!drag) return;
        const target = Math.max(-50, Math.min(50, drag.vx * 28));
        drag.spin += (target - drag.angle) * 0.16;
        drag.spin *= 0.8;
        drag.angle += drag.spin;
        drag.vx *= 0.9;
        drag.wrap.style.transform = `translate(${drag.x - drag.width / 2}px, ${drag.y - 10}px) rotate(${drag.angle.toFixed(2)}deg)`;
        drag.frame = requestAnimationFrame(tick);
      };
      tick();
    }

    function zoneAt(x, y) {
      return document.elementFromPoint(x, y)?.closest(".zone[data-zone]") || null;
    }

    function onMove(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const now = performance.now();
      drag.vx = drag.vx * 0.5 + ((event.clientX - drag.lastX) / Math.max(1, now - drag.lastT)) * 0.5;
      drag.lastX = event.clientX;
      drag.lastT = now;
      drag.x = event.clientX;
      drag.y = event.clientY;
      if (!drag.lifted && Math.hypot(drag.x - drag.startX, drag.y - drag.startY) > 6) lift();
      if (drag.lifted) {
        document.querySelectorAll(".room.drop-hover").forEach(room => room.classList.remove("drop-hover"));
        const zone = zoneAt(drag.x, drag.y);
        if (zone && zone.dataset.station) zone.classList.add("drop-hover");
      }
    }

    function onUp(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const current = drag;
      drag = null;
      cancelAnimationFrame(current.frame);
      current.wrap?.remove();
      current.element.classList.remove("lifting");
      document.querySelectorAll(".room.drop-hover").forEach(room => room.classList.remove("drop-hover"));
      if (!current.lifted) {
        // A tap: select (or unselect) this worker.
        sfx.select();
        select(state.selected === current.key ? null : current.key);
        suppressClick = performance.now() + 300;
        if (pendingRender) render();
        return;
      }
      const zone = event.type === "pointercancel" ? null : zoneAt(event.clientX, event.clientY);
      if (zone && zone.dataset.zone !== current.from) place(current.key, zone.dataset.zone, event.clientX, event.clientY - 30);
      else render();
      highlight(state.selected);
    }

    let suppressClick = 0;
    function wire() {
      $("floor").addEventListener("pointerdown", event => {
        const element = event.target.closest(".ch[data-key]");
        if (!element || event.button > 0) return;
        event.preventDefault();
        startDrag(event, element);
      });
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);

      // With someone selected, tap a bench (or the break room) to send them there.
      $("floor").addEventListener("click", event => {
        if (performance.now() < suppressClick || event.target.closest(".ch")) return;
        const zone = event.target.closest(".zone[data-zone]");
        if (!state.selected) return;
        if (!zone) { select(null); return; }
        const key = state.selected;
        if (zone.dataset.zone === (state.layout[state.phase].get(key) || "free")) return;
        if (place(key, zone.dataset.zone, event.clientX, event.clientY - 30)) select(null);
      });

      $("phaseTabs").addEventListener("click", event => {
        const button = event.target.closest("button[data-phase]");
        if (!button) return;
        state.phase = button.dataset.phase;
        sfx.select();
        render();
      });
      $("resetBtn").addEventListener("click", () => {
        if (!state.start) return;
        state.layout = Object.fromEntries(PHASES.map(phase => [phase, new Map(state.start[phase])]));
        select(null);
        render();
      });
      $("muteBtn").addEventListener("click", () => {
        muted = !muted;
        try { localStorage.setItem("shiftPlannerMuted", muted ? "1" : "0"); } catch { /* fine */ }
        drawMute();
        if (!muted) sfx.select();
      });
      $("dateInput").addEventListener("change", event => {
        if (event.target.value) openDate(event.target.value);
      });
    }

    async function start() {
      drawMute();
      await ensureAccess({ title: "Shift Planner", intro: "Enter the management or bench PIN.", pinLabel: "PIN", allowed: ["management", "bench"], wrongRoleMessage: "That PIN isn't right." });
      try {
        const staff = await getDocs(collection(db, "staff"));
        state.staff = new Map(staff.docs.map(entry => [entry.id, entry.data()]));
      } catch (error) {
        $("notice").textContent = friendlyError(error);
        return;
      }
      wire();
      const requested = new URLSearchParams(window.location.search).get("date");
      const today = new Date();
      const fallback = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
      openDate(/^\d{4}-\d{2}-\d{2}$/.test(requested || "") ? requested : fallback);
    }

    start();
  </script>
</body>
</html>
